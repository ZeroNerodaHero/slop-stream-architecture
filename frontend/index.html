<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      the theme this browser keeps, before first paint: the css variables the appearance setting
      derived (src/infra/atoms/settings-atoms.ts writes them under settings.themeVars), applied
      inline on <html> so a light or custom theme does not flash dark while the bundle loads.
      vite keeps a classic inline script as it is, and the api's /watch document leaves it in
      place (api/src/profile.rs looks for the title, the end of the head and #root only, none of
      them in here). nor may this comment spell the end-of-head tag out: vite's build injects the
      bundle before the first one it finds, and would put it inside the comment.
    -->
    <script>
      try {
        var kept = JSON.parse(localStorage.getItem('settings.themeVars') || 'null');
        if (kept && kept.vars) {
          var style = document.documentElement.style;
          for (var name in kept.vars) style.setProperty(name, kept.vars[name]);
          if (kept.scheme) style.setProperty('color-scheme', kept.scheme);
        }
      } catch (e) {}
    </script>
    <title>streams</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="root"></div>
    <!--
      the profile card the api puts inside #root when it serves /watch/<name>
      (api/src/profile.rs), so the page shows the name, picture, the word and the
      status line before react boots. react replaces it when it renders. a <template>
      draws nothing, so the pages caddy serves straight from this file are unaffected.
      {{...}} are the api's placeholders. the markup mirrors PageFrame + WatchPage;
      tailwind scans this file, so the classes here exist in the css. {{banner}} is a
      style, not markup: the offline picture as a background on the player's box while
      they are not live, and an api older than it leaves words the browser ignores.
      {{bio}} is the status line under the name, as markup (a span the api makes, so a
      name with none leaves nothing), like {{avatar}} and {{verified}}.
    -->
    <template id="watch-shell">
      <main class="mx-auto max-w-[1360px] px-5 pb-16 pt-6">
        <header class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b border-primaryStroke pb-4">
          <div class="flex min-w-0 items-center gap-4">
            <a id="home" href="/" class="inline-flex shrink-0 items-center justify-center gap-1 border border-primaryStroke bg-backgroundSecondary px-3 py-1.5 text-sm font-semibold text-textPrimary shadow-hard">
              <svg aria-hidden viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="currentColor">
                <path d="M10.8284 12.0007L15.7782 16.9504L14.364 18.3646L8 12.0007L14.364 5.63672L15.7782 7.05093L10.8284 12.0007Z" />
              </svg>
              home
            </a>
            <h1 class="min-w-0 border-l-4 border-primaryBlue pl-3 text-[28px] font-semibold leading-tight [overflow-wrap:anywhere]">{{avatar}}{{name}}{{verified}}{{bio}}</h1>
          </div>
        </header>
        <div class="lg:grid lg:grid-cols-[minmax(0,1fr)_360px] lg:items-start lg:gap-6">
          <div class="min-w-0">
            <div class="aspect-video w-full border border-primaryStroke bg-black bg-cover bg-center" style="{{banner}}"></div>
            <p class="my-3 text-2xl font-semibold {{tone}}">{{status}}</p>
          </div>
        </div>
      </main>
    </template>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
