name: monitor

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  monitor:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${MONITOR_IMAGE:-stream-api:latest}
    container_name: ${MONITOR_CONTAINER:-monitor}
    restart: unless-stopped
    logging: *default-logging
    command: ["monitor"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      TARGETS: ${STATS_TARGETS:-${TARGETS:-}}
      OPS_TOKENS: ${STATS_TOKENS:-${OPS_TOKENS:-}}
      OPS_TOKEN: ${OPS_TOKEN:-}
      ALERT_WEBHOOK: ${STATS_ALERT_WEBHOOK:-${ALERT_WEBHOOK:-}}
      PUBLIC: ${STATS_PUBLIC:-}
      RATE_LIMITS: ${RATE_LIMITS:-}
      CHECK_EVERY_SECS: ${CHECK_EVERY_SECS:-15}
      ERRORS_EVERY_SECS: ${ERRORS_EVERY_SECS:-60}
      METRICS_EVERY_SECS: ${METRICS_EVERY_SECS:-15}
      DOWN_AFTER: ${DOWN_AFTER:-3}
      PORT: "3002"
      DATA_DIR: /data
      RUST_LOG: info
    ports:
      - "127.0.0.1:${MONITOR_PORT:-3002}:3002"
    volumes:
      - monitor-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3002 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: ${MONITOR_CONTAINER:-monitor}-caddy
    profiles: ["tls"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      STATS_HOST: ${STATS_HOST:-stats.nodentity.xyz}
      STATS_TLS: ${STATS_TLS:-internal}
      STATS_BASIC_AUTH_USER: ${STATS_BASIC_AUTH_USER:-statsoff}
      STATS_BASIC_AUTH_HASH: ${STATS_BASIC_AUTH_HASH:-statsoff}
      STATS_PUBLIC: ${STATS_PUBLIC:-}
    ports:
      - "${STATS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      monitor:
        condition: service_started

volumes:
  monitor-data:
  caddy-data:
  caddy-config:
