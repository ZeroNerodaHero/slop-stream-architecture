name: monitor

services:
  monitor:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${MONITOR_IMAGE:-stream-api:latest}
    container_name: monitor
    restart: unless-stopped
    command: ["monitor"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      TARGETS: ${TARGETS:-}
      OPS_TOKENS: ${OPS_TOKENS:-}
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
      CHECK_EVERY_SECS: ${CHECK_EVERY_SECS:-15}
      ERRORS_EVERY_SECS: ${ERRORS_EVERY_SECS:-60}
      DOWN_AFTER: ${DOWN_AFTER:-3}
      PORT: "3002"
      DATA_DIR: /data
      RUST_LOG: info
    ports:
      - "127.0.0.1:${MONITOR_PORT:-3002}:3002"
    volumes:
      - monitor-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3002"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  monitor-data:
