# builds the four images on github's machines on every push to main that touches what
# they are built from (`paths` below: the list in ./image-paths, written out by hand
# because a filter cannot read a file) and pushes them to ghcr.io/<owner>/stream-<x>:<tag>
# and :latest. the tag is the last commit that touched ./image-paths (not the push head:
# a push can end on a docs commit), 7 characters; deploy.sh and ship.sh name the images by
# the same rule, so a docs-only commit runs the images of the one before it and nothing
# is recreated for it. the box then runs
#   ./deploy.sh --pull --images
# and pulls those, building nothing. see docs/spec.md, "deploy script".
#
# free: actions minutes are unlimited for a public repo, and public packages cost nothing.
# the runners are x86-64, so no emulation: the same dockerfiles ./deploy.sh and ./ship.sh use,
# built natively on 4 cores. the dependency layers are cached between runs (type=gha), so a
# source change is a few minutes; a Cargo.lock change rebuilds them once.
#
# the GITHUB_TOKEN pushes the packages; no personal token anywhere. packages a workflow
# creates take the repo's visibility, so from a public repo they are public from the first
# push and the box pulls without a login. (a push from a laptop with ./ship.sh makes them
# private instead; then: github › your profile › Packages › stream-x › Package settings › Change visibility.)
name: images

on:
  push:
    branches: [main]
    paths:
      - api/**
      - video/**
      - frontend/**
      - '!frontend/Caddyfile'
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/images.yml
      - image-paths   # the list this filter copies: a change to it always builds, so the two cannot drift unnoticed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pages
            context: frontend
            file: frontend/Dockerfile
          - name: api
            context: .
            file: api/Dockerfile
          - name: video
            context: .
            file: video/Dockerfile
          - name: dummy
            context: .
            file: video/Dockerfile.dummy
    steps:
      # the whole history: the tag is found by walking back to the last commit that touched
      # the image paths, and a shallow checkout might not see it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # the tag: the last commit that touched what the images are built from, 7 characters,
      # the same rule and the same list (./image-paths) as deploy.sh and ship.sh. owner lowercased, ghcr wants that
      - id: meta
        run: |
          mapfile -t paths < <(tr -d '\r' < image-paths | sed -E 's/[[:space:]]+$//' | grep -Ev '^[[:space:]]*(#|$)')
          # an empty list would make `git log -1 --` plain HEAD, a tag deploy.sh never asks for
          [ "${#paths[@]}" -gt 0 ] || { echo "image-paths is empty"; exit 1; }
          echo "tag=$(git log -1 --format=%h --abbrev=7 -- "${paths[@]}")" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/stream-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/stream-${{ matrix.name }}:latest
          build-args: |
            BUILD=${{ steps.meta.outputs.tag }}
            CARGO_BUILD_JOBS=4
          # links the package to this repo on github
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - run: |
          echo "pushed ghcr.io/${{ steps.meta.outputs.owner }}/stream-${{ matrix.name }}:${{ steps.meta.outputs.tag }}"
          echo "on the box:  ./deploy.sh --pull --images     (IMAGES=ghcr.io/${{ steps.meta.outputs.owner }}/ in its .env)"
