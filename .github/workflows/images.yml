name: images

on:
  push:
    branches: [main]
    paths:
      - api/**
      - video/**
      - relay/**
      - frontend/**
      - random-media/gifs/**
      - '!frontend/Caddyfile'
      - Cargo.toml
      - Cargo.lock
      - .dockerignore
      - .github/workflows/images.yml
      - image-paths
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: meta
        run: |
          mapfile -t paths < <(tr -d '\r' < image-paths | sed -E 's/[[:space:]]+$//' | grep -Ev '^[[:space:]]*(#|$)')
          [ "${#paths[@]}" -gt 0 ] || { echo "image-paths is empty"; exit 1; }
          echo "tag=$(git log -1 --format=%h --abbrev=7 -- "${paths[@]}")" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          here="$(git tag --points-at HEAD --list 'v[0-9]*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1 || true)"
          if [ -n "$here" ]; then
            version="v$here"
          else
            last="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -1 || true)"
            version="v$(( ${last:-0} + 1 ))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "images: stream-<x>:$(git log -1 --format=%h --abbrev=7 -- "${paths[@]}") = $version"

  image:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pages
            context: frontend
            file: frontend/Dockerfile
          - name: api
            context: .
            file: api/Dockerfile
          - name: video
            context: .
            file: video/Dockerfile
          - name: dummy
            context: .
            file: video/Dockerfile.dummy
          - name: relay
            context: .
            file: relay/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/stream-${{ matrix.name }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ needs.version.outputs.owner }}/stream-${{ matrix.name }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ needs.version.outputs.owner }}/stream-${{ matrix.name }}:latest
          build-args: |
            BUILD=${{ needs.version.outputs.tag }}
            CARGO_BUILD_JOBS=4
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - run: |
          echo "pushed ghcr.io/${{ needs.version.outputs.owner }}/stream-${{ matrix.name }}:${{ needs.version.outputs.tag }} = ${{ needs.version.outputs.version }}"
          echo "on the box:  ./scripts/deploy.sh --pull --images     (IMAGES=ghcr.io/${{ needs.version.outputs.owner }}/ in its .env)"

  release:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: |
          v="${{ needs.version.outputs.version }}"
          have="$(git ls-remote --tags origin "refs/tags/$v" "refs/tags/$v^{}" | tail -n 1 | cut -f1)"
          if [ -n "$have" ]; then
            [ "$have" = "$GITHUB_SHA" ] || { echo "::error::$v is already on $have, not on $GITHUB_SHA"; exit 1; }
            echo "$v is on this commit already"
            exit 0
          fi
          git tag "$v" "$GITHUB_SHA"
          git push origin "refs/tags/$v"
          echo "released $v: stream-<x>:$v = stream-<x>:${{ needs.version.outputs.tag }}, on $GITHUB_SHA"
          echo "on the box:  ./scripts/deploy.sh --pull     (/api/health then says \"version\": \"$v\")"
