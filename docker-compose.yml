# test stream
#
#   certs      makes the https cert once, then exits
#   pages      builds the react pages, copies them into a volume, then exits
#   frontend   caddy. serves the pages. /api and /watch -> api, /ws and /thumb -> video, /chat -> chat, http -> https
#   api        save a bio and a picture, go live, heartbeat, start/end log, the /watch page. also /api/health and /api/errors
#   chat       the text chat. websocket per viewer, last 500 lines per stream in redis
#   database   the bio and the session log. not the video. plus a second database, debug, for the pages' error reports
#   redis      who is live
#   s3         a seaweedfs bucket on this machine. S3_ENDPOINT=off (the default) uses it; a url uses that bucket instead
#   video      rust. one upload in, copies it out. media on udp 7882
#   dummy      fake streams for styling: gifs bouncing around. DUMMY_STREAMS in .env says how many
#
# start:  ./deploy.sh                 everything, first time or any time
#         ./deploy.sh api             only the api (also: frontend, video, dummy)
#         ./deploy.sh --pull          git pull, then rebuild what changed since the last deploy that ended well
#         ./deploy.sh --images TAG    no build here: pull the images ./ship.sh pushed from a laptop
#                                     (IMAGES=ghcr.io/<you>/ and TAG in .env name them; empty = built here)
#         (by hand: cp .env.example .env, set PUBLIC_IP, BUILD=$(git rev-parse --short HEAD) docker compose up -d --build)
#         the images carry BUILD and are named after the last commit that touched what they are
#         built from (./image-paths), so a full deploy (or `up -d --build`) restarts video whenever
#         that moved since the last one: every live stream ends. deploy.sh warns first.
# open:   https://<PUBLIC_IP from the .env file>
# ports:  80/tcp 443/tcp 7882/udp
# dummies: in .env set DUMMY_STREAMS=3 and DUMMY_PASSWORD=anyword, then ./deploy.sh dummy
# peek:   docker compose exec database psql -U stream
#         docker compose exec database psql -U stream -d debug      (the pages' error reports)
#         docker compose exec redis redis-cli
# health: https://<PUBLIC_IP>/api/health      errors: https://<PUBLIC_IP>/admin (ADMIN_NAMES in .env)

name: stream

# every long-running container logs through this: 3 files of 10 MB each, then the
# oldest goes. docker's default json-file has no cap, and caddy writes a line per
# request (home polls every 3s per open tab), so a lab left alone fills its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  certs:
    image: alpine/openssl
    container_name: certs
    restart: "no"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /certs
        if [ -f cert.pem ] && openssl x509 -in cert.pem -noout -ext subjectAltName,extendedKeyUsage 2>/dev/null | grep -q "IP Address:$$PUBLIC_IP\b" \
           && openssl x509 -in cert.pem -noout -ext extendedKeyUsage 2>/dev/null | grep -q "Server Authentication"; then
          echo "cert for $$PUBLIC_IP already there"
          exit 0
        fi
        # 825 days and serverAuth: the most apple devices will accept if you ever trust it by hand
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
          -days 825 -subj "/CN=stream $$PUBLIC_IP" \
          -addext "subjectAltName=IP:$$PUBLIC_IP,IP:127.0.0.1,DNS:localhost" \
          -addext "extendedKeyUsage=serverAuth" \
          -keyout key.pem -out cert.pem 2>/dev/null
        chmod 600 key.pem
        chmod 644 cert.pem
        echo "made cert for $$PUBLIC_IP"
    volumes:
      - certs-data:/certs

  pages:
    # builds the react pages (vite) and copies them into the volume caddy serves.
    # runs once per deploy, then exits. redeploying pages never restarts caddy.
    build:
      context: ./frontend
      args:
        # the commit, from deploy.sh. the pages send it with every error report
        BUILD: ${BUILD:-dev}
    # image names spelled out: compose would derive them from `name:` above, and
    # chat below names the api image by hand, so they must not move with the project name
    image: ${IMAGES:-}stream-pages:${TAG:-latest}
    container_name: pages
    restart: "no"
    volumes:
      - pages-data:/srv

  frontend:
    image: caddy:2-alpine
    container_name: frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      # not read by caddy. a change forces a restart so the new cert is loaded.
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - pages-data:/srv:ro
      - certs-data:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      certs:
        condition: service_completed_successfully
      pages:
        condition: service_completed_successfully
      api:
        condition: service_started
      video:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: api
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATABASE_URL: postgres://stream:stream@database:5432/stream
      # the pages' error reports. a second database in the same postgres, made by the api
      # when missing. the api runs fine without it. see docs/debugging.md
      DEBUG_DATABASE_URL: postgres://stream:stream@database:5432/debug
      REDIS_URL: redis://redis:6379/0
      VIDEO_URL: http://video:7880
      PORT: "4000"
      # names starting with dummy- need this password to go live (the dummy box has it)
      DUMMY_PASSWORD: ${DUMMY_PASSWORD:-}
      # what this box is called in /api/health and in stored errors. deploy.sh writes the
      # hostname into .env when it is empty; still empty (by hand) and the api says "unnamed"
      ENV_NAME: ${ENV_NAME:-}
      # who may read /api/errors: these accounts (the /admin page), or a bearer token (a machine)
      ADMIN_NAMES: ${ADMIN_NAMES:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      # off (the default): the s3 container below. a url: that bucket, with the key and secret.
      # the container's own login is not these two; it is the literals on the s3 service.
      S3_ENDPOINT: ${S3_ENDPOINT:-off}
      S3_BUCKET: ${S3_BUCKET:-stream}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-}
      # the built pages. /watch/<name> is served from here with that name's preview tags
      PAGES_DIR: /srv
      RUST_LOG: info
    volumes:
      - pages-data:/srv:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    # no host port. browsers reach this through the frontend, at /api and /watch

  chat:
    # the text chat. the api binary run as `api chat`, same image, no extra build.
    # one websocket per viewer at /chat/<name>; the live lines are a redis stream. see docs/chat.md.
    # CHAT_PERSIST=1 also writes each line to postgres, so a room can be scrolled, searched and jumped to.
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: chat
    restart: unless-stopped
    logging: *default-logging
    command: ["chat"]
    environment:
      DATABASE_URL: postgres://stream:stream@database:5432/stream
      REDIS_URL: redis://redis:6379/0
      PORT: "4100"
      # empty or 0: redis only, last 500 lines. 1: also keep every line in postgres.
      CHAT_PERSIST: ${CHAT_PERSIST:-}
      RUST_LOG: info
    depends_on:
      # healthy, not started: the api creates the tables (accounts included) on its
      # way up, and the chat reads them from its first socket on
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # the image's own check looks at the api port; this one looks at ours, and asks for a real
    # answer: a wedged process still accepts connections (the kernel's backlog does), it just
    # never answers. GET /health is "ok" from the same listener /chat and /events hang off
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4100 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    # one /events socket per browser, open on every page (docs/status.md), on top of the chat's
    # per room: a file descriptor each. docker's default soft limit is 1024 on recent daemons,
    # and a rust process does not raise its own the way go does: a thousand browsers, then
    # accept fails. see docs/transition.md
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # no host port. browsers reach this through the frontend, at /chat and /events

  database:
    image: postgres:17-alpine
    container_name: database
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: stream
    volumes:
      - database-data:/var/lib/postgresql/data
    # no host port. older docker leaks "127.0.0.1" ports to the lan. peek with:
    #   docker compose exec database psql -U stream
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d stream"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    # no save file. a restart loses who is live, every room's chat history and the
    # login/signup counters. the database keeps the bio and the accounts.
    command: redis-server --save "" --appendonly no
    # no host port. peek with: docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # minio's images are not public any more. seaweedfs `weed mini` is one process: s3 on
    # :8333, and it creates S3_BUCKET itself. login is stream / stream-s3, the same literals
    # api/src/s3.rs signs with when S3_ENDPOINT is off. path-style.
    image: chrislusf/seaweedfs:4.48
    container_name: s3
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["weed"]
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: stream
      AWS_SECRET_ACCESS_KEY: stream-s3
      S3_BUCKET: ${S3_BUCKET:-stream}
    volumes:
      - s3-data:/data
    # a 403 is the server up and asking for the signature. no answer is down.
    # no host port. the bucket name is S3_BUCKET.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  video:
    build:
      context: .
      dockerfile: video/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-video:${TAG:-latest}
    container_name: video
    restart: unless-stopped
    logging: *default-logging
    # processes + threads, together. every live stream costs one ffmpeg (a few
    # threads) for its thumbnail, and anyone can publish; this stops a flood from
    # starving the box instead of the stream. room for 25 or so streams. no cpu or
    # memory limit on purpose: small vms vary, and a limit that kills video ends
    # every stream at once.
    pids_limit: 256
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      WS_PORT: "7880"
      UDP_PORT: "7882"
      API_URL: http://api:4000
      DUMMY_PASSWORD: ${DUMMY_PASSWORD:-}
      # a picture of every live stream every few seconds, served at /thumb/<name>.jpg. THUMBS=0 turns it off
      THUMB_EVERY_SECS: "5"
      # webrtc_ice at error: at warn it logs one line per stray udp packet
      RUST_LOG: "warn,video=info,webrtc_ice=error"
    ports:
      # all the video packets, one port. host port must equal container port.
      - "7882:7882/udp"
    # 7880 (the setup websocket) stays inside. browsers reach it through the frontend, at /ws

  dummy:
    # fake streams for styling and debugging. each one is a few gifs (random-media/gifs, dealt
    # out at random) bouncing around, the stream's name on top, a clock, plus a quiet
    # tone. same binary as video, run as `video dummy`, with ffmpeg drawing the picture.
    # DUMMY_STREAMS=0 means it sits idle. change .env, then: ./deploy.sh dummy
    build:
      context: .
      dockerfile: video/Dockerfile.dummy
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-dummy:${TAG:-latest}
    container_name: dummy
    restart: unless-stopped
    logging: *default-logging
    # one ffmpeg per fake stream, like video above: ~30 threads each on a many-core box
    # (the lavfi source's pool grows with the cores). raise it before DUMMY_STREAMS goes past ~15
    pids_limit: 512
    environment:
      DUMMY_STREAMS: ${DUMMY_STREAMS:-0}
      DUMMY_PASSWORD: ${DUMMY_PASSWORD:-}
      # optional: your own names, comma separated. default: dummy-mango, dummy-pixel, ...
      DUMMY_NAMES: ${DUMMY_NAMES:-}
      VIDEO_WS_URL: ws://video:7880/ws
      API_URL: http://api:4000
      # pretend viewers talk in each dummy room. leave empty to turn that off.
      CHAT_WS_URL: ws://chat:4100
      RUST_LOG: "warn,video=info"
    depends_on:
      video:
        condition: service_started
      api:
        condition: service_started
      chat:
        condition: service_started

volumes:
  database-data:
  s3-data:
  certs-data:
  pages-data:
  caddy-data:
  caddy-config:
