name: stream

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  certs:
    image: alpine/openssl
    container_name: certs
    restart: "no"
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /certs
        if [ -f cert.pem ] && openssl x509 -in cert.pem -noout -ext subjectAltName,extendedKeyUsage 2>/dev/null | grep -q "IP Address:$$PUBLIC_IP\b" \
           && openssl x509 -in cert.pem -noout -ext extendedKeyUsage 2>/dev/null | grep -q "Server Authentication"; then
          echo "cert for $$PUBLIC_IP already there"
          exit 0
        fi
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
          -days 825 -subj "/CN=stream $$PUBLIC_IP" \
          -addext "subjectAltName=IP:$$PUBLIC_IP,IP:127.0.0.1,DNS:localhost" \
          -addext "extendedKeyUsage=serverAuth" \
          -keyout key.pem -out cert.pem 2>/dev/null
        chmod 600 key.pem
        chmod 644 cert.pem
        echo "made cert for $$PUBLIC_IP"
    volumes:
      - certs-data:/certs

  pages:
    build:
      context: ./frontend
      args:
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-pages:${TAG:-latest}
    container_name: pages
    restart: "no"
    volumes:
      - pages-data:/srv

  frontend:
    image: caddy:2-alpine
    container_name: frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      STATS_BASIC_AUTH_USER: ${STATS_BASIC_AUTH_USER:-statsoff}
      STATS_BASIC_AUTH_HASH: ${STATS_BASIC_AUTH_HASH:-statsoff}
      STATS_PUBLIC: ${STATS_PUBLIC:-}
    ports:
      - "80:80"
      - "443:443"
    networks:
      - default
      - stats
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - pages-data:/srv:ro
      - certs-data:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      certs:
        condition: service_completed_successfully
      pages:
        condition: service_completed_successfully
      api:
        condition: service_started
      video:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: api
    restart: unless-stopped
    logging: *default-logging
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      DATABASE_URL: postgres://stream:stream@database:5432/stream
      DEBUG_DATABASE_URL: postgres://stream:stream@database:5432/debug
      REDIS_URL: redis://redis:6379/0
      VIDEO_URL: http://video:7880
      PORT: "4000"
      DUMMY_PASSWORD: ${DUMMY_PASSWORD:-}
      HIDE_TEST_STREAMERS: ${HIDE_TEST_STREAMERS:-}
      ENV_NAME: ${ENV_NAME:-}
      ADMIN_NAMES: ${ADMIN_NAMES:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      CF_PURGE_TOKEN: ${CF_PURGE_TOKEN:-}
      CF_ZONE_ID: ${CF_ZONE_ID:-}
      GROUPS_PER_OWNER: ${GROUPS_PER_OWNER:-}
      VOICE_SECRET: ${VOICE_SECRET:-}
      VOICE_URL: http://voice:7881
      S3_ENDPOINT: ${S3_ENDPOINT:-off}
      S3_BUCKET: ${S3_BUCKET:-stream}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PAGES_DIR: /srv
      RUST_LOG: info
    volumes:
      - pages-data:/srv:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  chat:
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: chat
    restart: unless-stopped
    logging: *default-logging
    command: ["chat"]
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      DATABASE_URL: postgres://stream:stream@database:5432/stream
      REDIS_URL: redis://redis:6379/0
      PORT: "4100"
      CHAT_PERSIST: ${CHAT_PERSIST:-}
      ADMIN_NAMES: ${ADMIN_NAMES:-}
      HIDE_TEST_STREAMERS: ${HIDE_TEST_STREAMERS:-}
      RUST_LOG: info
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4100 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  events:
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: events
    restart: unless-stopped
    logging: *default-logging
    command: ["events"]
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      DATABASE_URL: postgres://stream:stream@database:5432/stream
      REDIS_URL: redis://redis:6379/0
      PORT: "4100"
      ADMIN_NAMES: ${ADMIN_NAMES:-}
      RUST_LOG: info
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4100 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  home:
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: home
    restart: unless-stopped
    logging: *default-logging
    command: ["home"]
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      HIDE_TEST_STREAMERS: ${HIDE_TEST_STREAMERS:-}
      DATABASE_URL: postgres://stream:stream@database:5432/stream
      REDIS_URL: redis://redis:6379/0
      VIDEO_URL: http://video:7880
      PORT: "4100"
      RUST_LOG: info
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4100 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  agent:
    image: ${IMAGES:-}stream-api:${TAG:-latest}
    container_name: agent
    restart: unless-stopped
    logging: *default-logging
    command: ["agent"]
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      PORT: "4300"
      SAMPLE_EVERY_SECS: "15"
      KEEP_SAMPLES: "240"
      HOST_PROC: /host/proc
      DISK_PATH: /disk
      DOCKER_SOCKET: /var/run/docker.sock
      TIMINGS_FROM: api=http://api:9300,chat=http://chat:9300,events=http://events:9300,home=http://home:9300,video=http://video:9300,voice=http://voice:9300
      RUST_LOG: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - agent-disk:/disk:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4300 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  database:
    image: postgres:17-alpine
    container_name: database
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: stream
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d stream"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: s3
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["weed"]
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: stream
      AWS_SECRET_ACCESS_KEY: stream-s3
      S3_BUCKET: ${S3_BUCKET:-stream}
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  video:
    build:
      context: .
      dockerfile: video/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-video:${TAG:-latest}
    container_name: video
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 256
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      WS_PORT: "7880"
      UDP_PORT: "7882"
      API_URL: http://api:4000
      DUMMY_PASSWORD: ${DUMMY_PASSWORD:-}
      THUMB_EVERY_SECS: "5"
      RUST_LOG: "warn,video=info,webrtc_ice=error"
    ports:
      - "7882:7882/udp"

  dummy:
    build:
      context: .
      dockerfile: video/Dockerfile.dummy
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
        BUILD: ${BUILD:-dev}
    image: ${IMAGES:-}stream-dummy:${TAG:-latest}
    container_name: dummy
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 512
    cpu_shares: 128
    environment:
      DUMMY_STREAMS: ${DUMMY_STREAMS:-0}
      DUMMY_PASSWORD: ${DUMMY_PASSWORD:-}
      DUMMY_NAMES: ${DUMMY_NAMES:-}
      DUMMY_CHAT: ${DUMMY_CHAT:-}
      DUMMY_CHAT_INTERVAL_MS: ${DUMMY_CHAT_INTERVAL_MS:-}
      VIDEO_WS_URL: ws://video:7880/ws
      API_URL: http://api:4000
      CHAT_WS_URL: ws://chat:4100
      RUST_LOG: "warn,video=info"
    depends_on:
      video:
        condition: service_started
      api:
        condition: service_started
      chat:
        condition: service_started

  voice:
    image: ${IMAGES:-}stream-video:${TAG:-latest}
    container_name: voice
    profiles: ["voice"]
    restart: unless-stopped
    logging: *default-logging
    command: ["voice"]
    pids_limit: 256
    environment:
      RATE_LIMITS: ${RATE_LIMITS:-}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      VOICE_WS_PORT: "7881"
      VOICE_UDP_PORT: "7883"
      API_URL: http://api:4000
      VOICE_SECRET: ${VOICE_SECRET:-}
      RUST_LOG: "warn,video=info,webrtc_ice=error"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7881 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    ports:
      - "7883:7883/udp"

networks:
  default:
  stats:

volumes:
  database-data:
  s3-data:
  certs-data:
  pages-data:
  caddy-data:
  caddy-config:
  agent-disk:
