[package]
name = "relay"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
axum = "0.8"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "process", "io-util"] }
uuid = { version = "1", features = ["serde"] }

[profile.release]
strip = true
debug = false
