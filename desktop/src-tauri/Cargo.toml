[package]
name = "nodentity"
version = "0.1.0"
description = "nodentity desktop app"
edition = "2021"
publish = false

[workspace]

[lib]
name = "nodentity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
