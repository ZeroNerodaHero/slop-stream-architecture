[package]
name = "dummy"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
env_logger = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "process", "signal"] }
tokio-tungstenite = "0.30"
webrtc = "0.17"
