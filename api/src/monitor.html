<!doctype html>
<!-- the monitor's one page. built into the api binary (monitor.rs), polls /api/monitor every 10s.
     plain html and js on purpose: the monitor box has no node, no vite, no caddy. every piece
     of text goes in through textContent, never innerHTML: error reports come from strangers'
     browsers. the colours are the frontend's tokens (globals.css). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>monitor</title>
<style>
  :root {
    --bg: rgb(15 17 21); --bg2: rgb(24 27 34); --bg3: rgb(32 36 46);
    --t1: rgb(242 243 245); --t2: rgb(154 163 178); --t3: rgb(110 118 132);
    --blue: rgb(79 139 255); --stroke: rgb(42 47 58);
    --up: rgb(63 185 80); --down: rgb(248 81 73); --warn: rgb(242 204 96);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--t1); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; border-left: 4px solid var(--blue); padding-left: 10px; line-height: 1.1; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
  .muted { color: var(--t2); } .dim { color: var(--t3); } .note { color: var(--warn); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .yes { color: var(--up); } .no { color: var(--down); }
  .target { background: var(--bg2); border: 1px solid var(--stroke); box-shadow: 6px 6px 0 0 var(--stroke); padding: 16px; margin-bottom: 24px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .name { font-size: 18px; font-weight: 600; }
  .pill { padding: 2px 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: rgb(15 17 21); }
  .pill.up { background: var(--up); } .pill.down { background: var(--down); } .pill.unknown { background: var(--t3); }
  .bar { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; margin: 12px 0 4px; }
  .bar i { display: block; height: 8px; background: var(--bg3); }
  .bar i.ok { background: var(--up); } .bar i.some { background: var(--warn); } .bar i.bad { background: var(--down); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px 12px; margin-top: 12px; }
  .grid div { background: var(--bg3); border: 1px solid var(--stroke); padding: 6px 10px; }
  .grid b { display: block; font-size: 11px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .05em; }
  .down .grid { opacity: .55; }
  h3 { font-size: 12px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 6px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 3px 0; border-top: 1px solid var(--stroke); } li:first-child { border-top: 0; }
  .when { color: var(--t3); margin-right: 10px; }
  .ev-down { color: var(--down); } .ev-up { color: var(--up); } .ev-restart { color: var(--warn); } .ev-build { color: var(--blue); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 8px 4px 0; border-top: 1px solid var(--stroke); vertical-align: top; }
  tr.err { cursor: pointer; } tr.err:hover td { background: var(--bg3); }
  pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 8px; padding: 8px; background: var(--bg); border: 1px solid var(--stroke); color: var(--t2); }
  .empty { color: var(--t3); padding: 6px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>monitor</h1>
    <span id="meta" class="muted"></span>
    <span id="asof" class="note"></span>
  </header>
  <div id="targets"></div>
</main>
<script>
(() => {
  const $targets = document.getElementById('targets');
  const $meta = document.getElementById('meta');
  const $asof = document.getElementById('asof');

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  };
  const pad = (n) => String(n).padStart(2, '0');
  const human = (s) => {
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return d ? `${d}d ${h}h` : h ? `${h}h ${pad(m)}m` : m ? `${m}m ${pad(x)}s` : `${x}s`;
  };
  const secsSince = (iso, now) => Math.max(0, Math.round((now - Date.parse(iso)) / 1000));
  const ago = (iso, now) => (iso ? `${human(secsSince(iso, now))} ago` : '—');
  const clock = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—');
  const pct = (v) => (v === null || v === undefined ? '—' : `${v.toFixed(v >= 99.95 ? 2 : 1)}%`);
  const yn = (v) => (v === true ? el('span', 'yes', '✓') : v === false ? el('span', 'no', '✗') : el('span', 'dim', '—'));
  const field = (label, value) => {
    const d = el('div');
    d.append(el('b', null, label));
    d.append(value instanceof Node ? value : el('span', null, value ?? '—'));
    return d;
  };

  function render(data) {
    const now = Date.parse(data.now);
    const m = data.monitor;
    $meta.textContent = `build ${m.build} · up ${human(m.up_secs)} · every ${m.check_every_secs}s · down after ${m.down_after} misses · ${m.webhook ? 'webhook on' : 'no webhook'}`;
    $targets.replaceChildren();
    if (!data.targets.length) {
      $targets.append(el('p', 'empty', 'nothing to watch. TARGETS in monitor/.env, then docker compose up -d'));
      return;
    }
    for (const t of data.targets) {
      const card = el('section', `target ${t.status}`);
      card.dataset.name = t.name;

      const top = el('div', 'top');
      top.append(el('span', 'name', t.name), el('span', `pill ${t.status}`, t.status));
      if (t.since && t.status !== 'unknown') top.append(el('span', 'muted', `for ${human(secsSince(t.since, now))}`));
      const a = el('a', 'mono', t.url);
      a.href = t.url; a.target = '_blank'; a.rel = 'noopener';
      top.append(a);
      if (t.latency_ms !== null && t.latency_ms !== undefined) top.append(el('span', 'dim mono', `${t.latency_ms} ms`));
      if (t.status === 'up' && t.failures > 0) top.append(el('span', 'note', `${t.failures} missed check${t.failures > 1 ? 's' : ''}: ${t.reason || ''}`));
      if (t.status === 'down' && t.reason) top.append(el('span', 'no', t.reason));
      card.append(top);

      // the last 24 hours, newest on the right. an empty block is an hour with no checks yet
      const bar = el('div', 'bar');
      const hours = (t.hours || []).slice().reverse();
      for (let i = hours.length; i < 24; i++) bar.append(el('i'));
      for (const h of hours) {
        const b = el('i', h.failed === 0 ? 'ok' : h.failed === h.checks ? 'bad' : 'some');
        b.title = `${clock(h.start)} · ${h.checks} checks, ${h.failed} failed`;
        bar.append(b);
      }
      card.append(bar, el('div', 'dim', `24h ${pct(t.uptime_24h)} · 7d ${pct(t.uptime_7d)} · checked ${ago(t.checked_at, now)}`));

      const h = t.health || {};
      const grid = el('div', 'grid');
      grid.append(
        field('build', h.build), field('env', h.env), field('live', h.live),
        field('video', yn(h.video)), field('postgres', yn(h.postgres)), field('redis', yn(h.redis)), field('debug db', yn(h.debug_db)),
        field('reports dropped', h.errors_dropped),
        field('api up', h.up_secs != null ? human(h.up_secs) : '—'), field('video up', h.video_up_secs != null ? human(h.video_up_secs) : '—'),
        field('video build', h.video_build)
      );
      card.append(grid);
      if (t.status === 'down' && t.health) card.append(el('div', 'dim', 'the numbers above are from its last answer'));

      card.append(el('h3', null, 'events'));
      if (!t.events.length) card.append(el('div', 'empty', 'none yet'));
      else {
        const ul = el('ul');
        for (const e of t.events) {
          const li = el('li', `ev-${e.kind}`);
          li.append(el('span', 'when mono', clock(e.at)), el('span', null, e.text));
          ul.append(li);
        }
        card.append(ul);
      }

      card.append(el('h3', null, 'error reports from the pages'));
      if (t.errors_status) card.append(el('div', 'empty', t.errors_status));
      else if (!t.errors.length) card.append(el('div', 'empty', `none stored · checked ${ago(t.errors_at, now)}`));
      else {
        const table = el('table');
        for (const r of t.errors) {
          const tr = el('tr', 'err');
          const where = r.page + (r.stream ? ` [${r.stream}${r.phase ? ' · ' + r.phase : ''}]` : '');
          tr.append(el('td', 'mono dim', clock(r.at)), el('td', 'mono', r.kind), el('td', 'mono', where), el('td', null, r.message));
          const detail = el('tr');
          detail.hidden = true;
          const td = el('td');
          td.colSpan = 4;
          const lines = [r.build && `build ${r.build}`, r.env && `env ${r.env}`, r.me && `login ${r.me}`, r.ip && `ip ${r.ip}`, r.ua && `ua ${r.ua}`, r.stack, r.extra && JSON.stringify(r.extra, null, 2)];
          td.append(el('pre', 'mono', lines.filter(Boolean).join('\n')));
          detail.append(td);
          tr.addEventListener('click', () => { detail.hidden = !detail.hidden; });
          table.append(tr, detail);
        }
        card.append(table);
      }
      $targets.append(card);
    }
  }

  let last = null;
  async function tick() {
    try {
      const res = await fetch('/api/monitor', { cache: 'no-store' });
      if (!res.ok) throw new Error(`GET /api/monitor answered ${res.status}`);
      render(await res.json());
      last = Date.now();
      $asof.textContent = '';
    } catch (e) {
      $asof.textContent = last ? `could not refresh (${e.message}). as of ${clock(new Date(last).toISOString())}` : `could not load: ${e.message}`;
    }
  }
  tick();
  setInterval(tick, 10000);
})();
</script>
</body>
</html>
