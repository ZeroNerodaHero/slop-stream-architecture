<html lang="en">
<head>

<style>
  :root {
    --bg: rgb(15 17 21); --bg2: rgb(24 27 34); --bg3: rgb(32 36 46);

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  .target { background: var(--bg2); border: 1px solid var(--stroke); padding: 12px; }

  .strip { flex: none; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 12px; --card-w: clamp(142px, 11vw, 190px); --card-h: 82px; }

  .fwrap { position: relative; flex: none; }

  .fbtn.on { color: var(--blue); border-color: var(--blue); background: rgb(30 38 56); }
  .fmenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; min-width: 190px; background: var(--bg2); border: 1px solid var(--t3); padding: 2px 0; }
  .fitem { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 10px; background: none; border: 0; font-size: 13px; color: var(--t1); text-align: left; white-space: nowrap; }
  .fitem:hover, .fitem:focus-visible { background: var(--bg3); outline: none; }

  .eps td { white-space: nowrap; font-variant-numeric: tabular-nums; }

  .eps th button:hover, .eps th[aria-sort] button, .ctrs th button:hover, .ctrs th[aria-sort] button { color: var(--t1); }

  @supports not selector(::-webkit-scrollbar) {

  .st-running { color: var(--up); } .st-exited, .st-dead { color: var(--down); } .st-restarting, .st-paused, .st-created { color: var(--warn); }
  .archv { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 10px; }
  .archl { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
  .arch-wrap { position: relative; display: flex; flex: 1 1 auto; min-height: 0; overflow: auto; border: 1px solid var(--stroke); }
  .arch { display: block; flex: none; margin: auto; }
  .arch text { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--t1); }
  .arch .lane-box { fill: none; stroke: var(--stroke); }
  .arch .lane-label { fill: var(--t3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .arch .node { cursor: pointer; }
  .arch .node rect.box { fill: var(--bg3); stroke-width: 1; }
  .arch .node:hover rect.box, .arch .node.pinned rect.box { fill: rgb(40 45 58); }
  .arch .node.pinned rect.box { stroke-width: 2; }
  .arch .node text.sub { fill: var(--t2); font-size: 11px; }
  .arch .node text.nm { font-size: 12px; }
  .arch .divide { stroke: var(--stroke); }
  .arch text.mlab { font-size: 9px; fill: var(--t3); letter-spacing: .05em; }
  .arch text.mval { font-size: 10.5px; fill: var(--t2); font-variant-numeric: tabular-nums; }
  .arch rect.seg:not(.on) { fill: rgb(255 255 255 / .08); }
  .arch .s-done rect.seg:not(.on) { fill: rgb(255 255 255 / .04); }
  .h-ok { background: var(--up); fill: var(--up); } .h-warn { background: var(--orange); fill: var(--orange); } .h-bad { background: var(--down); fill: var(--down); }
  .h-none, .h-off { background: var(--t3); fill: var(--t3); } .h-off { opacity: .45; }
  .ht-ok, .arch text.ht-ok { color: var(--up); fill: var(--up); } .ht-warn, .arch text.ht-warn { color: var(--orange); fill: var(--orange); } .ht-bad, .arch text.ht-bad { color: var(--down); fill: var(--down); }
  .ht-none, .ht-off, .arch text.ht-none, .arch text.ht-off { color: var(--t3); fill: var(--t3); }
  .hdots { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: 0; }
  span.hd { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; }
  span.hd.tipped { text-decoration: none; }
  .hrows { display: grid; gap: 6px; font-size: 12px; }
  .hhead { display: flex; align-items: center; gap: 6px; }
  .hhead b { width: 46px; font-size: 11px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .05em; }
  .hsum { margin-left: 14px; color: var(--t2); overflow-wrap: anywhere; }
  .hruns { display: flex; align-items: center; gap: 2px; margin: 3px 0 0 14px; }
  .hruns i { display: block; width: 8px; height: 8px; background: var(--up); }
  .hruns i.bad { background: var(--down); }
  .hruns span { margin-left: 6px; font-size: 11px; }
  .hout { margin: 2px 0 0 14px; font-size: 11px; color: var(--t3); overflow-wrap: anywhere; white-space: normal; user-select: text; }
  .ctitle { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .arch .s-ok rect.box { stroke: var(--up); } .arch .s-ok rect.st { fill: var(--up); }
  .arch .s-warn rect.box { stroke: var(--orange); } .arch .s-warn rect.st { fill: var(--orange); }
  .arch .s-none rect.box { stroke: var(--t3); }
  .arch .s-bad rect.box { stroke: var(--down); } .arch .s-bad rect.st { fill: var(--down); }
  .arch .s-done rect.box { stroke: var(--t3); stroke-dasharray: 3 3; } .arch .s-done rect.st { fill: var(--t3); } .arch .s-done text { fill: var(--t2); }
  .arch .s-outside rect.box { stroke: var(--blue); fill: var(--bg2); } .arch .s-outside rect.st { fill: var(--blue); }
  .arch .edge path { fill: none; stroke: var(--t3); stroke-width: 1.25; }
  .arch .edge.d-in path { stroke: var(--blue); }
  .arch .edge.d-out path { stroke: var(--violet); }
  .arch .edge.v-depends_on path { stroke-dasharray: 2 4; }
  .arch .edge.cut path { stroke: var(--down); stroke-dasharray: 6 3; }
  .arch .edge.off path { opacity: .35; }
  .arch .elabel { display: none; }
  .arch .elabel rect { fill: var(--bg); stroke: var(--stroke); }
  .arch .elabel text { font-size: 10px; fill: var(--t2); }
  .arch .edge.hot .elabel { display: inline; }
  .arch.focus .edge:not(.hot) { opacity: .1; }
  .arch.focus .node:not(.hot) { opacity: .35; }
  .arch .edge.hot path { stroke-width: 2.25; }
  .arch .edge.hot.d-inter path { stroke: var(--t1); }
  .arch .edge.hot .elabel text { fill: var(--t1); }
  .tip { position: absolute; z-index: 2; pointer-events: none; background: var(--bg); border: 1px solid var(--t3); padding: 4px 8px; font-size: 12px; white-space: nowrap; }
  .tip b { font-weight: 600; margin-right: 6px; }
  .nets { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; }
  .nets button { background: var(--bg3); border: 1px solid var(--stroke); padding: 1px 7px; color: var(--t2); }
  .nets button:hover, .nets button[aria-pressed="true"] { color: var(--t1); border-color: var(--t3); }
  .nets i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: 0; }
  .keyline { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 11px; color: var(--t3); align-items: center; flex: none; }
  .np-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .np-head .name { font-size: 17px; }
  .desc { color: var(--t2); margin: 8px 0 0; font-size: 13px; }
  .use { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 8px; align-items: center; font-size: 12px; margin-top: 4px; }
  .use .lbl { color: var(--t3); }
  .use .track { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--stroke); }
  .use .track i { position: absolute; left: 0; top: 0; bottom: 0; }
  .use .txt { grid-column: 2; color: var(--t2); font-variant-numeric: tabular-nums; }
  .use canvas { grid-column: 2; display: block; width: 100%; height: 26px; }
  .kv { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 3px 8px; font-size: 12px; }
  .kv b { font-weight: 400; color: var(--t3); }
  .kv span { overflow-wrap: anywhere; user-select: text; }
  .links { display: flex; flex-direction: column; gap: 2px; }
  .links button { display: flex; gap: 8px; align-items: baseline; text-align: left; background: none; border: 1px solid transparent; padding: 2px 6px; font-size: 12px; }
  .links button:hover, .links button[aria-pressed="true"] { border-color: var(--t3); background: var(--bg3); }
  .links button i { display: inline-block; width: 8px; height: 2px; flex: none; align-self: center; }
  .links .what { color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="brand"><img src="/icon.png" alt="" width="20" height="20">stats</span>
    <nav id="views" class="views" role="tablist" aria-label="what to show"></nav>
    <span class="spacer"></span>
    <div id="site" class="site" role="group" aria-label="the site right now"></div>
    <div id="box" class="picker"></div>
    <div id="ranges" class="seg" role="group" aria-label="range"></div>
    <input id="q" type="search" placeholder="search" spellcheck="false" autocomplete="off" aria-label="search this tab; every word must match; press / to focus">
    <span id="status" class="dot" role="status" aria-label="refresh status"></span>
  </header>
  <main id="main" role="tabpanel"></main>
</div>
<script>
(() => {
  const $views = document.getElementById('views');
  const $box = document.getElementById('box');
  const $site = document.getElementById('site');
  const $ranges = document.getElementById('ranges');
  const $q = document.getElementById('q');
  const $status = document.getElementById('status');
  const $main = document.getElementById('main');

  const RANGES = { '1h': { secs: 3600, every: 15000 }, '24h': { secs: 86400, every: 60000 }, '7d': { secs: 604800, every: 300000 } };
  const ALL = '';
  const COLORS = { blue: 'rgb(79 139 255)', green: 'rgb(63 185 80)', red: 'rgb(248 81 73)', yellow: 'rgb(242 204 96)', violet: 'rgb(188 140 255)', cyan: 'rgb(110 200 220)', white: 'rgb(242 243 245)', grid: 'rgb(42 47 58)', hover: 'rgb(110 118 132)', t2: 'rgb(154 163 178)', t3: 'rgb(110 118 132)' };
  const NET_COLORS = ['rgb(79 139 255)', 'rgb(63 185 80)', 'rgb(188 140 255)', 'rgb(242 204 96)', 'rgb(110 200 220)', 'rgb(240 140 90)', 'rgb(220 120 200)', 'rgb(160 200 90)'];
  const DIR_COLORS = { in: COLORS.blue, out: COLORS.violet, inter: COLORS.t3 };
  const TABS = [
    { id: 'host', label: 'Host' },
    { id: 'containers', label: 'Containers' },
    { id: 'endpoints', label: 'Endpoints' },
    { id: 'calls', label: 'Calls' },
  ];
  const DIRS = [['in', 'client → backend'], ['out', 'backend → client'], ['inter', 'between services']];
  const DIR_NAME = Object.fromEntries(DIRS);
  const ENDPOINT_KINDS = ['http', 'ws', 'session', 'setup'];
  const KIND_LABEL = { http: 'http', db: 'postgres', redis: 'redis', s3: 's3', video: 'video', voice: 'voice', api: 'api', ws: 'ws upgrade', setup: 'webrtc setup', session: 'stream', 'session-ws': 'websocket', 'session-webrtc': 'webrtc' };
  const CARD_ORDER = ['http', 'ws', 'session-ws', 'session-webrtc', 'setup', 'db', 'redis', 's3', 'video', 'voice', 'api'];
  const LIMITS = { http: [100, 500], ws: [100, 500], setup: [500, 2000], db: [10, 100], redis: [2, 20], s3: [100, 1000], video: [100, 1000], voice: [100, 1000], api: [100, 1000] };
  const DEFAULT_SORT = 'sum_ms';
  const LIMIT = 250;
  const ARCH_EVERY = 15000;
  const SPARK_EVERY = 60000;
  const CHICAGO = 'America/Chicago';

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs, text) => {
    const e = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) e.setAttribute(k, String(v));
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  };
  const button = (cls, text, onClick) => {
    const b = el('button', cls, text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  };
  const pad = (n) => String(n).padStart(2, '0');
  const human = (s) => {
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return d ? `${d}d ${h}h` : h ? `${h}h ${pad(m)}m` : m ? `${m}m ${pad(x)}s` : `${x}s`;
  };
  const secsSince = (iso, now) => Math.max(0, Math.round((now - Date.parse(iso)) / 1000));
  const ago = (iso, now) => (iso ? `${human(secsSince(iso, now))} ago` : '—');
  const clock = (iso) => (iso ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—');
  const stamp = (secs, range) => new Date(secs * 1000).toLocaleString(undefined, range === '1h' ? { hour: '2-digit', minute: '2-digit', second: '2-digit' } : { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const chicago = (secs) => `${new Date(secs * 1000).toLocaleString('en-US', { timeZone: CHICAGO, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit', timeZoneName: 'short' })}`;
  const has = (v) => v !== null && v !== undefined && !Number.isNaN(v);
  const pct = (v) => (has(v) ? `${v.toFixed(v >= 99.95 ? 2 : 1)}%` : '—');
  const pct1 = (v) => (has(v) ? `${v.toFixed(1)}%` : '—');
  const unit = (v, base, units) => {
    if (!has(v)) return '—';
    let i = 0;
    while (Math.abs(v) >= base && i < units.length - 1) { v /= base; i++; }
    return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)} ${units[i]}`;
  };
  const bytes = (v) => unit(v, 1024, ['B', 'KiB', 'MiB', 'GiB', 'TiB']);
  const bps = (v) => unit(v, 1000, ['bit/s', 'kbit/s', 'Mbit/s', 'Gbit/s']);
  const kbps = (v) => {
    let i = 0;
    while (v >= 1000 && i < 3) { v /= 1000; i++; }
    return i === 0 ? `${Math.round(v)}b` : `${v >= 100 ? Math.round(v) : v.toFixed(1)}${['', 'k', 'M', 'G'][i]}`;
  };
  const netCell = (rx, tx) => {
    const td = el('td', 'mono net');
    const a = has(rx) ? rx : 0, b = has(tx) ? tx : 0, total = a + b;
    if (!(total > 0)) { td.textContent = '—'; return td; }
    const row = el('div', 'netrow');
    row.append(el('span', 'nettotal', bps(total)));
    const bar = el('div', 'netbar');
    bar.style.background = COLORS.grid;
    const seg = (v, color) => { const i = el('i'); i.style.width = `${(v / total) * 100}%`; i.style.background = color; return i; };
    const lbl = el('span');
    lbl.append(el('span', null, `↓ ${kbps(a)}`), el('span', null, `↑ ${kbps(b)}`));
    bar.append(seg(a, COLORS.green), seg(b, COLORS.red), lbl);
    row.append(bar);
    td.append(row);
    return td;
  };
  const Bps = (v) => (has(v) ? `${bytes(v)}/s` : '—');
  const num = (v) => (has(v) ? String(Math.round(v * 100) / 100) : '—');
  const yn = (v) => (v === true ? el('span', 'yes', '✓') : v === false ? el('span', 'no', '✗') : el('span', 'dim', '—'));
  const field = (label, value) => {
    const d = el('div');
    d.append(el('b', null, label));
    d.append(value instanceof Node ? value : el('span', null, value ?? '—'));
    return d;
  };
  const ms = (v) => (!has(v) ? '—' : v === 0 ? '0' : v < 1 ? `${Math.max(1, Math.round(v * 1000))} µs` : v < 10 ? `${v.toFixed(2)} ms` : v < 1000 ? `${v.toFixed(v < 100 ? 1 : 0)} ms` : `${(v / 1000).toFixed(2)} s`);
  const spent = (v) => (!has(v) ? '—' : v < 1000 ? ms(v) : v < 60000 ? `${(v / 1000).toFixed(1)} s` : v < 3600000 ? `${(v / 60000).toFixed(1)} min` : `${(v / 3600000).toFixed(1)} h`);
  const count = (v) => (!has(v) ? '—' : v >= 1e6 ? `${(v / 1e6).toFixed(1)}M` : v >= 1e4 ? `${Math.round(v / 1e3)}k` : v >= 1e3 ? `${(v / 1e3).toFixed(1)}k` : String(v));
  const rate = (v) => (!has(v) ? '—' : v === 0 ? '0' : v < 0.01 ? '<0.01' : v < 10 ? v.toFixed(2) : String(Math.round(v)));
  const share = (v) => (!has(v) ? '—' : v >= 0.995 ? '100%' : v >= 0.1 ? `${Math.round(v * 100)}%` : v >= 0.001 ? `${(v * 100).toFixed(1)}%` : v > 0 ? '<0.1%' : '0%');
  const per = (secs) => ({ 60: 'minute', 900: '15 minutes', 3600: 'hour' })[secs] || `${secs}s`;
  const blocking = (r) => / BLOCK$/.test(r.name || '');
  const list = (v) => (Array.isArray(v) ? v : []);
  const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
  const str = (v) => (v === null || v === undefined ? '' : String(v));
  const numOr0 = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
  const numOrNull = (v) => (v === null || v === undefined || !Number.isFinite(Number(v)) ? null : Number(v));
  const defaultDir = (kind) => (ENDPOINT_KINDS.includes(kind) ? 'in' : 'inter');
  const normState = (d) => ({
    ...d,
    monitor: obj(d.monitor),
    targets: list(d.targets).filter((t) => t && typeof t === 'object' && t.name).map((t) => ({ ...t, events: list(t.events), errors: list(t.errors) })),
  });
  const TIMING_NUMS = ['mean', 'p50', 'p95', 'p99', 'max', 'rate'];
  const normTimingRow = (r) => {
    const kind = str(r.kind);
    const dir = ['in', 'out', 'inter'].includes(r.dir) ? r.dir : defaultDir(kind);
    const out = { ...r, kind, dir, method: str(r.method), name: str(r.name), src: str(r.src), key: str(r.key), target: r.target ?? null };
    for (const k of ['n', 'e4', 'e5', 'err', 'sum_ms', 'msgs', 'bytes', 'open', 'open_peak', 'msgs_rate', 'bytes_rate']) out[k] = numOr0(r[k]);
    for (const k of TIMING_NUMS) out[k] = numOrNull(r[k]);
    return out;
  };
  const normTimings = (d) => ({
    ...d,
    rows: list(d.rows).filter((r) => r && typeof r === 'object').map(normTimingRow),
    totals: list(d.totals).filter((r) => r && typeof r === 'object').map(normTimingRow),
  });
  const normDetail = (d) => {
    const t = list(d.t);
    const out = { ...d, t };
    for (const k of ['n', 'e4', 'e5', 'err', 'sum', 'p50', 'p95', 'p99', 'max', 'msgs', 'bytes', 'open']) {
      const v = list(d[k]);
      out[k] = t.map((_, i) => numOrNull(v[i]));
    }
    out.avg = t.map((_, i) => (out.n[i] > 0 && has(out.sum[i]) ? out.sum[i] / out.n[i] : null));
    return out;
  };
  const normArch = (d) => ({
    ...d,
    host: obj(d.host),
    nodes: list(d.nodes).filter((n) => n && typeof n === 'object' && n.id).map((n) => ({ ...n, name: str(n.name || n.id), description: str(n.description), networks: list(n.networks), ports: list(n.ports) })),
    edges: list(d.edges).filter((e) => e && typeof e === 'object' && e.from && e.to).map((e) => ({ ...e, what: str(e.what), dir: ['in', 'out', 'inter'].includes(e.dir) ? e.dir : 'inter' })),
    networks: list(d.networks).filter((n) => n && n.name).map((n) => ({ ...n, members: list(n.members) })),
  });
  const normSeries = (d) => ({ ...d, t: list(d.t), host: obj(d.host), containers: obj(d.containers) });
  const problems = new Map();
  const guard = (what, fn) => {
    try {
      return fn();
    } catch (e) {
      console.error(what, e);
      problems.set(`draw ${what}`, `could not draw ${what}: ${e && e.message ? e.message : e}`);
      const sec = el('section', 'target');
      sec.append(el('h2', null, what), el('p', 'note', `could not draw this part: ${e && e.message ? e.message : e}. the rest of the page keeps refreshing`));
      return sec;
    }
  };
  const limitsOf = (r) => (blocking(r) ? null : LIMITS[r.kind] || null);
  const grade = (v, lim) => (!has(v) || !lim ? '' : v < lim[0] ? 'ok' : v < lim[1] ? 'warn' : 'bad');
  const cardKey = (r) => (r.kind === 'session' ? `session-${r.method || 'ws'}` : r.kind);
  const cardId = (r) => `${r.dir}|${cardKey(r)}`;
  const kindLabel = (k) => KIND_LABEL[k] || k;

  const sel = { box: null, range: '1h', tab: 'host', cview: 'table', ctr: null, cq: '' };
  const views = {
    endpoints: { name: 'endpoints', q: '', pick: new Set(), errs: '', sort: DEFAULT_SORT, dir: -1, open: null, detail: null, ui: null },
    calls: { name: 'calls', q: '', pick: new Set(), errs: '', sort: DEFAULT_SORT, dir: -1, open: null, detail: null, ui: null },
  };
  const pinned = new Map();
  const litEdge = new Map();
  const seriesCache = new Map();
  const sparkCache = new Map();
  const archCache = new Map();
  const archBuilt = new Map();
  const hostBuilt = new Map();
  const ctrBuilt = new Map();
  const tm = { data: null, error: null, at: 0, key: '' };
  let state = null, stateError = null, pageBuild = null;
  const charts = [];
  const tcharts = [];
  const DRAWER_KEY = 'stats.drawerWidth';
  const DRAWER_MIN = 360;
  const DRAWER_MAX = 0.85;
  let drawerPx = null, drawerTimer = null;
  try {
    const n = Number(localStorage.getItem(DRAWER_KEY));
    if (Number.isFinite(n) && n > 0) drawerPx = n;
  } catch (e) {
    console.warn('drawer width', e);
  }

  const HEALTH_KEY = 'stats.hideHealth';
  const HEALTH_ROUTE = /^(health|healthz|healthcheck|health-check|health_check|livez|readyz|liveness|readiness|ping)$/i;
  let hideHealth = false;
  try { hideHealth = localStorage.getItem(HEALTH_KEY) === '1'; } catch (e) { console.warn('filters', e); }
  const isHealth = (r) => HEALTH_ROUTE.test(String(r.name || '').split(/[?#\s]/)[0].split('/').filter(Boolean).pop() || '');
  function setHideHealth(on) {
    hideHealth = on;
    try { if (on) localStorage.setItem(HEALTH_KEY, '1'); else localStorage.removeItem(HEALTH_KEY); } catch (e) { console.warn('filters', e); }
  }

  const SORT_KEY = 'stats.sort.';
  const sorts = {};
  function sortOf(table, cols, fallback) {
    if (!sorts[table]) {
      let got = null;
      try { got = JSON.parse(localStorage.getItem(SORT_KEY + table) || 'null'); } catch (e) { got = null; }
      sorts[table] = got && typeof got === 'object' && (got.dir === 1 || got.dir === -1) && typeof got.col === 'string' ? got : { ...fallback };
    }
    if (!cols.some((c) => c.id === sorts[table].col)) sorts[table] = { ...fallback };
    return sorts[table];
  }
  function setSort(table, next) {
    sorts[table] = next;

  const agoWord = (s) => (s === null ? 'never' : `${human(s)} ago`);
  function dockerHealth(c, at, now) {
    if (c.state !== 'running') return { g: 'off', word: c.state, tip: `not running (${c.state}), so docker runs no check`, sum: '', runs: [] };
    if (!c.health) return { g: 'none', word: 'no check', tip: 'no healthcheck in its compose service or its image', sum: 'no healthcheck in its compose service or its image', runs: [] };
    const k = obj(c.check), runs = list(k.runs), last = runs[0], every = k.interval_secs || null, streak = k.failing_streak || 0;
    const stale = last && every ? agoSecs(at, last.at) > 2 * every : false;
    const g = c.health === 'unhealthy' ? 'bad' : c.health === 'starting' || streak > 0 || stale ? 'warn' : 'ok';
    const why = [];

  function apiHealth(c, at, now, serverNow) {

    if (!a || !list(a.runs).length) return { g: 'none', word: 'no endpoint', tip: 'no http health endpoint watched for it: the api\u2019s is the monitor\u2019s own poll, the others come from HEALTH_FROM on the box\u2019s agent', sum: 'none watched (the api\u2019s is the monitor\u2019s poll; the rest is HEALTH_FROM on the box\u2019s agent)', runs: [] };
    const runs = a.runs, last = runs[0], every = a.every_secs || 15;
    const who = a.from === 'monitor' ? 'the monitor' : 'the box\u2019s agent';
    const age = agoSecs(a.from === 'monitor' ? serverNow : at, last.at);
    const fails = runs.filter((r) => !r.ok).length;
    const slow = last.ok && last.ms > (SLOW_MS[a.from] || 500);
    const stale = age !== null && age > 2 * every + 5;
    const g = !last.ok ? 'bad' : stale || slow || fails ? 'warn' : 'ok';

    const why = [];

    if (stale) why.push('no check in over twice its interval');
    if (fails) why.push(`${fails} of the last ${runs.length} failed`);
    const facts = [`${who} GETs ${a.path} every ${human(every)}`, `last ${agoWord(agoSecs(now, last.at))}${last.status ? `, ${last.status}` : ''} in ${ms(last.ms)}`];
    const sum = [...why, ...facts].join(' · ');
    return {
      g, word, sum, tip: `${word} · ${sum}`,
      runs: runs.map((r) => ({ ok: r.ok, text: `${agoWord(agoSecs(now, r.at))} · ${r.ok ? r.status || 'ok' : r.error || r.status || 'failed'} · ${ms(r.ms)}` })),

      rest,
      pin,
      mode: () => L.m,
      unwatch: () => watch.disconnect(),
      light: (ids) => (ids ? paint(ids, (e) => ids.includes(e.from) && ids.includes(e.to)) : rest()),
      edge: (e) => (e ? just(e) : rest()),
    };
  }

  function timingBuild(v) {
    const sec = el('section', 'grow');
    sec.style.cssText = 'display: flex; flex-direction: column; gap: 6px; min-height: 0;';
    const strip = el('div', 'strip');
    const info = el('div', 'tbar');
    const q = el('input', 'tq');
    q.type = 'search';
    q.spellcheck = false;
    q.autocomplete = 'off';
    q.value = v.q;
    q.setAttribute('aria-label', `search ${v.name} by ${v.name === 'endpoints' ? 'route' : 'name'}, service or kind; every word must match; press / to focus`);
    q.addEventListener('input', () => { v.q = q.value; writeHash(); timingRender(v); });
    q.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      e.stopPropagation();
      if (q.value) { q.value = ''; q.dispatchEvent(new Event('input')); } else q.blur();
    });
    const notes = el('span', 'tnotes');
    const fwrap = el('div', 'fwrap');
    const fbtn = button('fbtn', null, () => (menu.hidden ? openMenu() : closeMenu(false)));
    fbtn.setAttribute('aria-haspopup', 'true');
    fbtn.setAttribute('aria-expanded', 'false');
    const icon = sv('svg', { viewBox: '0 0 16 16', width: 14, height: 14, 'aria-hidden': 'true' });
    icon.append(sv('path', { d: 'M2 3h12l-4.5 5.5V13l-3 1.5V8.5z', fill: 'none', stroke: 'currentColor', 'stroke-width': 1.4, 'stroke-linejoin': 'round' }));
    fbtn.append(icon);
    const menu = el('div', 'fmenu');
    menu.setAttribute('role', 'menu');
    menu.hidden = true;
    const healthItem = button('fitem', null, () => { setHideHealth(!hideHealth); timingRender(v); });
    healthItem.setAttribute('role', 'menuitemcheckbox');
    healthItem.append(el('i', 'fchk'), el('span', null, 'Hide health checks'));
    healthItem.title = '/health, /api/health, /healthz, /livez, /readyz, ping and the like';
    menu.append(healthItem);
    const openMenu = () => {
      menu.hidden = false;
      fbtn.setAttribute('aria-expanded', 'true');
      healthItem.focus();
    };
    const closeMenu = (refocus) => {
      if (menu.hidden) return;
      menu.hidden = true;
      fbtn.setAttribute('aria-expanded', 'false');
      if (refocus) fbtn.focus();
    };
    menu.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
      else if (e.key === 'Tab') closeMenu(false);
    });
    document.addEventListener('pointerdown', (e) => { if (!fwrap.contains(e.target)) closeMenu(false); });
    fwrap.addEventListener('focusout', (e) => { if (e.relatedTarget && !fwrap.contains(e.relatedTarget)) closeMenu(false); });
    fwrap.append(fbtn, menu);
    info.append(q, notes, fwrap);
    const wrap = el('div', 'twrap grow');
    const pane = el('div', 'pane');
    pane.dataset.scroll = `${v.name}-table`;
    const table = el('table', 'eps');
    const thead = el('thead');
    const tbody = el('tbody');
    table.append(thead, tbody);
    pane.append(table);
    const drawer = el('aside', 'drawer');
    drawer.setAttribute('role', 'dialog');
    drawer.setAttribute('aria-modal', 'false');
    drawer.setAttribute('aria-label', 'line details');
    const grip = el('div', 'grip');
    grip.tabIndex = 0;
    grip.setAttribute('role', 'separator');
    grip.setAttribute('aria-orientation', 'vertical');
    grip.setAttribute('aria-label', 'panel width');
    grip.title = 'drag to resize, double-click for half';
    grip.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      const right = wrap.getBoundingClientRect().right;
      document.body.classList.add('resizing');
      grip.classList.add('drag');
      const move = (ev) => { drawerPx = clampDrawer(right - ev.clientX); applyDrawerWidth(); redrawDrawer(); };
      const up = () => {
        grip.removeEventListener('pointermove', move);
        grip.removeEventListener('pointerup', up);
        grip.removeEventListener('pointercancel', up);
        document.body.classList.remove('resizing');
        grip.classList.remove('drag');
        saveDrawerWidth();
        redrawDrawer();
      };
      grip.addEventListener('pointermove', move);
      grip.addEventListener('pointerup', up);
      grip.addEventListener('pointercancel', up);
    });
    grip.addEventListener('dblclick', () => { drawerPx = null; applyDrawerWidth(); saveDrawerWidth(); redrawDrawer(); });
    grip.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      drawerPx = clampDrawer(drawer.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? 32 : -32));
      applyDrawerWidth();
      saveDrawerWidth();
      redrawDrawer();
    });
    wrap.append(pane, drawer);
    sec.append(strip, info, wrap);
    v.ui = { sec, info, q, notes, fbtn, healthItem, thead, tbody, strip, pane, drawer, grip };
    applyDrawerWidth();
  }

  function clampDrawer(px) {
    return Math.round(Math.max(DRAWER_MIN, Math.min(Math.floor(innerWidth * DRAWER_MAX), px)));
  }

  function applyDrawerWidth() {
    const w = drawerPx === null ? '' : `${clampDrawer(drawerPx)}px`;
    for (const v of Object.values(views)) if (v.ui && v.ui.drawer.style.width !== w) v.ui.drawer.style.width = w;
  }

  function saveDrawerWidth() {
    try {
      if (drawerPx === null) localStorage.removeItem(DRAWER_KEY);
      else localStorage.setItem(DRAWER_KEY, String(drawerPx));
    } catch (e) {
      console.warn('drawer width', e);
    }
  }

  function redrawDrawer() {
    clearTimeout(drawerTimer);
    drawerTimer = setTimeout(() => { for (const c of tcharts) if (c.canvas.closest('.drawer')) draw(c); }, 60);
  }

  function openRow(v, id) {
    if (v.open === id) return;
    v.open = id;
    v.detail = null;
    writeHash();
    timingRender(v);
    if (id) loadDetail(v).then(() => timingRender(v));
  }

  function stepRow(v, by) {
    const order = v.order || [];
    if (!order.length) return;
    const i = order.indexOf(v.open);
    const j = i < 0 ? (by > 0 ? 0 : order.length - 1) : i + by;
    if (j < 0 || j >= order.length) return;
    openRow(v, order[j]);
    const tr = v.ui.tbody.querySelector(`tr.ep.open`);
    if (tr) tr.scrollIntoView({ block: 'nearest' });
  }

  function timingNow() {
    return tm.data ? Date.parse(tm.data.now) + (Date.now() - tm.data.received) : Date.now();
  }

  const inView = (v, kind) => (v.name === 'endpoints' ? ENDPOINT_KINDS.includes(kind) : !ENDPOINT_KINDS.includes(kind));

  function colsFor(v, multi, rows) {
    const E = v.name === 'endpoints';
    const streams = rows.some((r) => r.kind === 'session');
    const other = rows.some((r) => r.kind !== 'http');
    const all = [
      { id: 'target', label: 'box', show: multi },
      { id: 'method', label: 'method', show: E },
      { id: 'name', label: E ? 'route' : 'kind and call' },
      { id: 'src', label: 'where' },
      { id: 'n', label: 'count', num: true, fmt: count },
      { id: 'rate', label: '/s', num: true, fmt: rate },
      { id: 'open', label: 'open', num: true, fmt: count, show: streams, stream: true },
      { id: 'msgs_rate', label: 'msg/s', num: true, fmt: rate, show: streams, stream: true },
      { id: 'bytes_rate', label: 'bytes/s', num: true, fmt: Bps, show: streams, stream: true },
      { id: 'sum_ms', label: 'total time', num: true, fmt: spent },
      { id: 'share', label: 'share', num: true },
      { id: 'p99', label: 'p99', num: true, fmt: ms, graded: true },
      { id: 'max', label: 'max', num: true, fmt: ms, graded: true },
      { id: 'e4', label: '4xx', num: true, fmt: count, bad: 'note', show: E },
      { id: 'e5', label: '5xx', num: true, fmt: count, bad: 'no', show: E },
      { id: 'err', label: 'errors', num: true, fmt: count, bad: 'no', show: !E || other },
    ];
    return all.filter((c) => c.show !== false);
  }

  function totalsFor(target) {
    return ((tm.data && tm.data.totals) || []).filter((r) => (target ? r.target === target : r.target === null));
  }

  function quantileOf(b, max, q) {
    const total = b.reduce((s, [, c]) => s + c, 0);
    if (!total) return null;
    const rank = Math.min(total, Math.max(1, Math.ceil(q * total)));
    let seen = 0;
    for (const [at, c] of b) {
      seen += c;
      if (seen >= rank) return max > 0 ? Math.min(at, max) : at;
    }
    return null;
  }

  function sumRows(rows) {
    const out = new Map();
    for (const r of rows) {
      if (r.kind === 'session' || blocking(r)) continue;
      const id = `${r.dir}|${r.kind}`;
      if (!out.has(id)) out.set(id, { target: null, kind: r.kind, dir: r.dir, n: 0, e4: 0, e5: 0, err: 0, sum_ms: 0, rate: 0, max: null, b: new Map() });
      const a = out.get(id);
      a.n += r.n; a.e4 += r.e4; a.e5 += r.e5; a.err += r.err; a.sum_ms += r.sum_ms; a.rate += r.rate;
      if (has(r.max)) a.max = Math.max(a.max || 0, r.max);
      for (const [at, c] of r.b || []) a.b.set(at, (a.b.get(at) || 0) + c);
    }
    return [...out.values()].map(({ b, ...a }) => {
      const sorted = [...b].sort((x, y) => x[0] - y[0]);
      return { ...a, p99: quantileOf(sorted, a.max, 0.99) };
    });
  }

  function cardsFor(v, totals, target, rows) {
    const out = new Map();
    for (const r of totals) {
      if (!inView(v, r.kind) || r.kind === 'session') continue;
      out.set(`${r.dir}|${r.kind}`, { id: `${r.dir}|${r.kind}`, dir: r.dir, key: r.kind, r });
    }
    for (const r of rows) {
      if (r.kind !== 'session' || (target && r.target !== target)) continue;
      const id = cardId(r);
      if (!out.has(id)) out.set(id, { id, dir: r.dir, key: cardKey(r), r: { kind: 'session', method: r.method, dir: r.dir, n: 0, err: 0, open: 0, msgs: 0, bytes: 0, msgs_rate: 0, bytes_rate: 0, max: null, sum_ms: 0 } });
      const a = out.get(id).r;
      a.n += r.n; a.err += r.err; a.open += r.open; a.msgs += r.msgs; a.bytes += r.bytes; a.msgs_rate += r.msgs_rate; a.bytes_rate += r.bytes_rate; a.sum_ms += r.sum_ms;
      if (has(r.max)) a.max = Math.max(a.max || 0, r.max);
    }
    for (const id of v.pick) {
      if (out.has(id)) continue;
      const [dir, key] = id.split('|');
      if (!inView(v, key.replace(/^session-.*/, 'session'))) continue;
      out.set(id, { id, dir, key, r: { kind: key.startsWith('session-') ? 'session' : key, dir, n: 0, err: 0, e4: 0, e5: 0, open: 0, msgs: 0, bytes: 0, msgs_rate: 0, bytes_rate: 0, sum_ms: 0, rate: 0, p99: null, max: null } });
    }
    const order = (k) => { const i = CARD_ORDER.indexOf(k); return i < 0 ? CARD_ORDER.length : i; };
    return [...out.values()].sort((a, b) => order(a.key) - order(b.key) || b.r.sum_ms - a.r.sum_ms || a.key.localeCompare(b.key));
  }

  function pickCard(v, ids, e) {
    const many = e && (e.shiftKey || e.metaKey || e.ctrlKey);
    if (many) {
      for (const id of ids) if (v.pick.has(id) && ids.length === 1) v.pick.delete(id); else v.pick.add(id);
    } else {
      const same = v.pick.size === ids.length && ids.every((id) => v.pick.has(id));
      v.pick = same ? new Set() : new Set(ids);
    }
    if (!v.pick.size) v.errs = '';
    v.open = null;
    writeHash();
    timingRender(v);
  }

  function card(v, c) {
    const r = c.r;
    const box = el('div', 'card');
    box.tabIndex = 0;
    box.setAttribute('role', 'button');
    box.setAttribute('aria-pressed', String(v.pick.has(c.id)));
    box.dataset.card = c.id;
    box.addEventListener('click', (e) => pickCard(v, [c.id], e));
    box.addEventListener('keydown', (e) => { if (e.target === box && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pickCard(v, [c.id], e); } });
    const lim = limitsOf(r);
    const head = el('div', 'c-head');
    const big = el('div', 'c-big');
    const one = el('div', 'c-line');
    const two = el('div', 'c-line');
    const kv = (k, val, cls) => {
      const sp = el('span');
      if (k) sp.append(document.createTextNode(`${k} `));
      sp.append(el('b', cls || null, val));
      return sp;
    };
    const tight = (x) => (has(x) && x >= 1 && x < 10 ? `${x.toFixed(1)} ms` : has(x) && x >= 10 && x < 1000 ? `${Math.round(x)} ms` : ms(x));
    const tightSpent = (x) => (has(x) && x >= 600000 && x < 3600000 ? `${Math.round(x / 60000)} min` : spent(x));
    const fill = (line) => { if (!line.childNodes.length) line.append(el('span', null, '\u00a0')); };
    head.append(el('span', `c-kind k-${c.key}`, kindLabel(c.key)));
    if (r.kind === 'session' && c.dir === 'out') {
      head.append(el('span', 'dim', count(r.msgs)));
      head.title = `${count(r.msgs)} messages sent over the range`;
      big.append(el('span', null, rate(r.msgs_rate)), el('small', null, 'msg/s'));
      one.append(kv('out', Bps(r.bytes_rate)));
      two.append(kv('sent', bytes(r.bytes)));
      two.title = 'bytes sent over the range';
    } else if (r.kind === 'session') {
      head.append(el('span', 'dim', count(r.n)));
      head.title = `${count(r.n)} sessions ended over the range`;
      big.append(el('span', null, count(r.open)), el('small', null, 'open'));
      one.append(kv('in', `${rate(r.msgs_rate)}/s`), kv('', Bps(r.bytes_rate)));
      two.append(kv('dropped', count(r.err), r.err ? 'no' : null));
      if (has(r.max)) two.append(kv('max', tightSpent(r.max)));
    } else {
      head.append(el('span', 'dim', count(r.n)));
      head.title = `${count(r.n)} over the range, ${rate(r.rate)}/s`;
      big.append(el('span', null, spent(r.sum_ms)), el('small', null, 'spent'));
      one.append(kv('p99', tight(r.p99), grade(r.p99, lim) ? `g-${grade(r.p99, lim)}` : null), kv('max', tight(r.max), grade(r.max, lim) ? `g-${grade(r.max, lim)}` : null));
      one.title = `p99 ${ms(r.p99)} · max ${ms(r.max)}`;
      two.append(kv('', `${rate(r.rate)}/s`));
      if (r.kind === 'http') {
        for (const [k, cls] of [['e5', 'no'], ['e4', 'note']]) {
          const b = button(null, null, (e) => {
            e.stopPropagation();
            if (v.errs === k && v.pick.has(c.id)) v.errs = '';
            else { v.errs = k; if (!v.pick.has(c.id)) v.pick = new Set([c.id]); }
            v.open = null;
            writeHash();
            timingRender(v);
          });
          b.append(kv(k === 'e5' ? '5xx' : '4xx', count(r[k]), r[k] ? cls : null));
          b.title = `only rows with ${k === 'e5' ? '5xx' : '4xx'} answers`;
          b.setAttribute('aria-pressed', String(v.errs === k && v.pick.has(c.id)));
          two.append(b);
        }
      } else {
        const e = kv(c.key === 'setup' ? 'failed' : 'errors', count(r.err), r.err ? 'no' : null);
        if (c.key === 'setup') e.title = 'never connected';
        two.append(e);
      }
    }
    fill(one);
    fill(two);
    box.append(head, big, one, two);
    return box;
  }

  function timingCards(v, totals, target, rows, filter) {
    const ui = v.ui;
    const sig = `${tm.data ? tm.data.received : 0}|${target}|${[...v.pick].sort().join(',')}|${v.errs}|${filter}`;
    if (ui.cardsSig === sig && ui.strip.childNodes.length) return;
    ui.cardsSig = sig;
    const cards = cardsFor(v, totals, target, rows);
    if (!cards.length) { ui.strip.replaceChildren(); ui.strip.hidden = true; return; }
    ui.strip.hidden = false;
    const all = button('card allc', 'all', () => { v.pick = new Set(); v.errs = ''; v.open = null; writeHash(); timingRender(v); });
    all.setAttribute('aria-pressed', String(!v.pick.size && !v.errs));
    all.title = 'every kind and direction';
    const first = el('div', 'grp');
    first.append(el('span', 'grp-head', '\u00a0'), all);
    const parts = [first];
    for (const [dir, label] of DIRS) {
      const mine = cards.filter((c) => c.dir === dir);
      if (!mine.length) continue;
      const grp = el('div', 'grp');
      const ids = mine.map((c) => c.id);
      const head = button('grp-head', label, (e) => pickCard(v, ids, e));
      head.setAttribute('aria-pressed', String(v.pick.size === ids.length && ids.every((id) => v.pick.has(id))));
      head.title = `only ${label}`;
      const row = el('div', 'grp-cards');
      row.append(...mine.map((c) => card(v, c)));
      grp.append(head, row);
      parts.push(grp);
    }
    const scroll = ui.strip.scrollLeft;
    ui.strip.replaceChildren(...parts);
    ui.strip.scrollLeft = scroll;
  }

  function timingBar(v, total) {
    const ui = v.ui;
    if (ui.q.value !== v.q) ui.q.value = v.q;
    ui.q.placeholder = tm.data ? `search ${count(total)} lines over ${tm.data.range}` : 'search';
    ui.fbtn.classList.toggle('on', hideHealth);
    ui.fbtn.setAttribute('aria-label', hideHealth ? 'filters: health checks hidden' : 'filters');
    ui.fbtn.title = hideHealth ? 'filters: health checks hidden' : 'filters';
    ui.healthItem.setAttribute('aria-checked', String(hideHealth));
  }

  function rowTag(r) {
    const k = cardKey(r);
    return `${kindLabel(k)}${r.kind === 'session' || r.dir !== defaultDir(r.kind) ? ` ${r.dir}` : ''}`;
  }

  function timingRender(v) {
    if (!state || !state.targets.length) return;
    if (!v.ui) timingBuild(v);
    const ui = v.ui;
    tcharts.length = 0;
    const shown = boxShown();
    const multi = shown === ALL && state.targets.length > 1;
    const target = shown === ALL ? null : shown;
    const rows = ((tm.data && tm.data.rows) || []).filter((r) => inView(v, r.kind) && (!target || r.target === target));
    const words = v.q.toLowerCase().split(/\s+/).filter(Boolean);
    const filtering = words.length > 0 || hideHealth;
    const kept = !filtering ? rows : rows.filter((r) => !(hideHealth && isHealth(r))
      && words.every((w) => `${r.target} ${r.kind} ${rowTag(r)} ${DIR_NAME[r.dir]} ${r.method} ${r.name} ${r.src}`.toLowerCase().includes(w)));
    const sums = filtering ? sumRows(kept) : totalsFor(target);
    timingCards(v, sums, target, kept, filtering ? `${words.join(' ')}|${hideHealth}` : '');
    timingBar(v, rows.length);

    const totals = new Map(sums.map((r) => [`${r.dir}|${r.kind}`, r]));
    const list2 = kept.filter((r) => (!v.pick.size || v.pick.has(cardId(r))) && (!v.errs || r[v.errs] > 0));
    for (const r of list2) {
      const k = totals.get(`${r.dir}|${r.kind}`);
      r.share = r.kind !== 'session' && k && k.sum_ms > 0 && !blocking(r) ? r.sum_ms / k.sum_ms : null;
    }
    const cols = colsFor(v, multi, list2.length ? list2 : rows);
    const col = cols.find((c) => c.id === v.sort) || cols.find((c) => c.id === DEFAULT_SORT);
    const sess = (r) => r.kind === 'session';
    list2.sort((a, b) => {
      if (col.id === 'sum_ms' && sess(a) !== sess(b)) return sess(a) ? -1 : 1;
      if (col.id === 'sum_ms' && sess(a)) return b.open - a.open || b.msgs_rate - a.msgs_rate || b.n - a.n;
      if (col.id === 'sum_ms' && blocking(a) !== blocking(b)) return blocking(a) ? 1 : -1;
      const x = a[col.id], y = b[col.id];
      const nx = !has(x) || x === '', ny = !has(y) || y === '';
      if (nx || ny) return nx && ny ? b.sum_ms - a.sum_ms : nx ? 1 : -1;
      const d = typeof x === 'number' ? x - y : String(x).localeCompare(String(y));
      return d * v.dir || b.sum_ms - a.sum_ms;
    });
    const shownRows = list2.slice(0, LIMIT);
    const notes = [];
    if (tm.data) {
      if (list2.length !== rows.length) notes.push(`${list2.length} of ${rows.length}`);
      if (list2.length > LIMIT) notes.push(`the first ${LIMIT} shown`);
      if (v.errs) notes.push(`only ${v.errs === 'e5' ? '5xx' : '4xx'}`);
      for (const [box, n] of Object.entries(tm.data.dropped || {})) notes.push(`${box}: ${n} new lines dropped, the table holds 400 per box`);
    }
    if (tm.error) notes.push(`could not refresh: ${tm.error}`);
    ui.notes.textContent = notes.join(' · ');
    ui.notes.title = ui.notes.textContent;

    const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.col : null;
    const head = el('tr');
    for (const c of cols) {
      const th = el('th', c.num ? 'num' : null);
      const b = button(null, c.label + (c.id === col.id ? (v.dir < 0 ? ' ▼' : ' ▲') : ''), () => {
        if (col.id === c.id) v.dir = -v.dir;
        else { v.sort = c.id; v.dir = c.num ? -1 : 1; }
        writeHash();
        timingRender(v);
      });
      b.dataset.col = c.id;
      b.title = `sort by ${c.label}`;
      if (c.id === col.id) th.setAttribute('aria-sort', v.dir < 0 ? 'descending' : 'ascending');
      th.append(b);
      head.append(th);
    }
    ui.thead.replaceChildren(head);
    if (focused) {
      const again = ui.thead.querySelector(`button[data-col="${focused}"]`);
      if (again) again.focus();
    }

    const body = [];
    const empty = (text) => {
      const tr = el('tr');
      const td = el('td', 'empty', text);
      td.colSpan = cols.length;
      tr.append(td);
      body.push(tr);
    };
    if (!rows.length) empty(!tm.data ? (tm.error ? tm.error : 'loading') : 'no timings yet. each box sends them through its agent (TIMINGS_FROM in docker-compose.yml) once it runs this build');
    else if (!list2.length) empty('nothing matches');
    const now = timingNow();
    const tagged = new Set(list2.map(cardId)).size > 1;
    for (const r of shownRows) {
      const id = `${r.target}\u0000${r.key}`;
      const lim = limitsOf(r);
      const tr = el('tr', `ep${v.open === id ? ' open' : ''}`);
      tr.tabIndex = 0;
      tr.setAttribute('aria-selected', String(v.open === id));
      for (const c of cols) {
        if (c.id === 'share') {
          const td = el('td', 'num mono');
          if (has(r.share)) {
            const bar = el('span', 'share');
            const fill = el('i');
            fill.style.width = `${Math.round((r.share || 0) * 100)}%`;
            bar.append(fill);
            td.append(bar);
          }
          td.append(document.createTextNode(share(r.share)));
          tr.append(td);
          continue;
        }
        const val = r[c.id];
        const g = c.graded ? grade(val, lim) : '';
        const blank = (c.stream && r.kind !== 'session') || (c.id === 'sum_ms' && r.kind === 'session');
        const cls = [c.num ? 'num mono' : '', c.id === 'name' ? 'ep-name mono' : '', !blank && c.bad && val > 0 ? c.bad : '', g ? `g-${g}` : '', c.id === 'src' || c.id === 'method' ? 'dim' : ''].filter(Boolean).join(' ');
        const fmt = r.kind === 'session' && c.fmt === ms ? spent : c.fmt;
        const td = el('td', cls, blank ? '—' : fmt ? fmt(val) : val || '—');
        if (c.id === 'name') {
          td.title = `${rowTag(r)} ${r.name} · ${DIR_NAME[r.dir]}`;
          if (tagged) td.prepend(el('span', `ktag k-${cardKey(r)}`, rowTag(r)));
        }
        if (r.kind === 'session' && (c.id === 'n' || c.graded)) td.title = c.id === 'n' ? 'sessions ended' : 'how long a session lasted';
        tr.append(td);
      }
      const toggle = () => openRow(v, v.open === id ? null : id);
      tr.addEventListener('click', toggle);
      tr.addEventListener('keydown', (e) => { if (e.target === tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(); } });
      body.push(tr);
    }
    v.order = shownRows.map((r) => `${r.target}\u0000${r.key}`);
    ui.tbody.replaceChildren(...body);
    timingDrawer(v, now);
    for (const c of tcharts) draw(c);
    ui.sig = timingSig(v);
  }

  function timingSig(v) {
    return `${tm.data ? tm.data.received : 0}|${tm.error}|${boxShown()}|${v.open}|${v.detail ? `${v.detail.id}|${v.detail.received || v.detail.error}` : ''}`;
  }

  function findRow(id) {
    if (!id || !tm.data) return null;
    const [target, key] = id.split('\u0000');
    return tm.data.rows.find((r) => r.target === target && r.key === key) || null;
  }

  const faultTime = (at) => new Date(at).toLocaleString('en-US', { timeZone: CHICAGO, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' });

  function faultTile(F, summary) {
    const t = el('div', 'tile wide');
    const head = el('div', 'head');
    const rows = F && Array.isArray(F.rows) ? F.rows : [];
    head.append(el('span', 'label', 'errors'), el('span', 'value mono', `${summary}${rows.length ? ` · newest ${rows.length} kept, times in Chicago` : ''}`));
    t.append(head);
    if (!F) t.append(el('div', 'empty', 'loading'));
    else if (F.error) t.append(el('div', 'note', `could not load the errors: ${F.error}`));
    else if (!rows.length) t.append(el('div', 'empty', 'none kept: no errors since this process last started'));
    else {
      const list = el('div', 'flist');
      list.setAttribute('role', 'list');
      for (const f of rows) {
        const code = String(f.code == null ? '' : f.code);
        const row = el('div', 'frow');
        row.setAttribute('role', 'listitem');
        row.append(
          el('span', 'mono dim', has(f.at) ? faultTime(f.at) : '—'),
          el('span', `mono ${code.startsWith('4') ? 'note' : 'no'}`, code || '—'),
          el('span', 'fmsg', typeof f.msg === 'string' && f.msg ? f.msg : '—'),
          el('span', 'fms mono dim', has(f.ms) ? ms(f.ms) : '—'));
        list.append(row);
      }
      t.append(list);
    }
    return t;
  }

  function pairOf(r) {
    if (!r || r.kind !== 'session' || !tm.data) return null;
    return tm.data.rows.find((x) => x.target === r.target && x.kind === 'session' && x.method === r.method && x.name === r.name && x.src === r.src && x.dir !== r.dir) || null;
  }

  function timingDrawer(v, now) {
    const dr = v.ui.drawer;
    const keep = dr.querySelector('.dr-body');
    const scroll = keep ? keep.scrollTop : 0;
    const keptList = dr.querySelector('.flist');
    const listScroll = keptList ? keptList.scrollTop : 0;
    if (!v.open) {
      if (hintAt && dr.contains(hintAt)) hideHint();
      dr.classList.remove('on');
      return;
    }
    const r = findRow(v.open);
    const [target, key] = v.open.split('\u0000');
    const order = v.order || [];
    const at = order.indexOf(v.open);
    const head = el('div', 'dr-head');
    const title = el('div', 'dr-title');
    const sub = el('div', 'dr-sub');
    if (r) {
      title.append(el('div', 'dr-name mono', `${r.method && r.kind !== 'session' ? r.method + ' ' : ''}${r.name}`));
      sub.append(el('span', `k-${cardKey(r)}`, kindLabel(cardKey(r))), el('span', null, DIR_NAME[r.dir]), el('span', 'dim', `${r.target} · ${r.src}`));
    } else {
      title.append(el('div', 'dr-name mono', key));
      sub.append(el('span', 'dim', tm.data ? `${target}: no calls over ${tm.data.range}` : 'loading'));
    }
    title.append(sub);
    const nav = el('div', 'dr-nav');
    const prev = button(null, '↑', () => stepRow(v, -1));
    prev.title = 'previous line (↑ or k)';
    prev.setAttribute('aria-label', 'previous line');
    prev.disabled = at <= 0 && order.length > 0 && at !== -1;
    const next = button(null, '↓', () => stepRow(v, 1));
    next.title = 'next line (↓ or j)';
    next.setAttribute('aria-label', 'next line');
    next.disabled = at >= order.length - 1 && at !== -1;
    const close = button(null, '✕', () => openRow(v, null));
    close.title = 'close (esc)';
    close.setAttribute('aria-label', 'close');
    nav.append(el('span', null, at >= 0 ? `${at + 1} of ${order.length}` : ''), prev, next, close);
    head.append(title, nav);

    const stats = el('div', 'dr-stats');
    const stat = (k, val, cls, tip) => {
      const d = el('div');
      const b = el('b');
      b.append(tip ? tipped(k, tip) : document.createTextNode(k));
      d.append(b, el('span', cls, val));
      stats.append(d);
    };
    const S = r && r.kind === 'session';
    const over = `over the last ${sel.range}`;
    const noun = r ? (r.kind === 'http' ? ['request', 'requests'] : r.kind === 'ws' ? ['handshake', 'handshakes'] : ['call', 'calls']) : ['call', 'calls'];
    const timed = r && r.kind === 'http' ? 'timed on the server, from the request arriving to its response being ready to send (a streamed body is not counted)'
      : r && r.kind === 'ws' ? 'timed on the server, from the websocket upgrade request arriving to its 101 answer'
      : 'timed by the service that made it, from sending the call to its answer coming back';
    const est = 'read from a histogram, so close but not exact';
    const pctl = (k, what) => ({
      avg: `the average ${what}: all of them added up, divided by how many there were, ${over}.`,
      p50: `the median ${what}: half were shorter than this, half longer, ${over}; ${est}.`,
      p95: `95% were shorter than this; 1 in 20 took longer. ${what[0].toUpperCase() + what.slice(1)}, ${over}; ${est}.`,
      p99: `99% were shorter than this; 1 in 100 took longer. ${what[0].toUpperCase() + what.slice(1)}, ${over}; ${est}.`,
      max: `the single longest ${what} ${over}.`
    })[k];
    const pair = S ? pairOf(r) : null;
    const I = S ? (r.dir === 'out' ? pair : r) : null;
    const O = S ? (r.dir === 'out' ? r : pair) : null;
    if (r && S) {
      stat('open now', count(I ? I.open : 0), null, 'connections open right now, at the latest reading.');
      stat('most open', count(I ? I.open_peak : 0), null, `the most connections open at the same time at any reading ${over}.`);
      stat('ended', count(I ? I.n : 0), null, `connections that closed ${over}, cleanly or not.`);
      stat('dropped', count(I ? I.err : 0), I && I.err ? 'no' : null, `connections ${over} that broke instead of closing cleanly: a read error on a websocket, the peer going away on webrtc.`);
      for (const k of ['mean', 'p50', 'p95', 'p99', 'max']) {
        const n = k === 'mean' ? 'avg' : k;
        stat(n, spent(I ? I[k] : null), null, `${pctl(n, 'session length')} A session runs from connect to close; only connections that ended count.`);
      }
      stat('msg/s in', rate(I ? I.msgs_rate : 0), null, `messages from the client to the server per second, averaged ${over}.`);
      stat('msg/s out', rate(O ? O.msgs_rate : 0), null, `messages from the server to the client per second, averaged ${over}.`);
      stat('in', Bps(I ? I.bytes_rate : 0), null, `bytes from the client to the server per second, averaged ${over}.`);
      stat('out', Bps(O ? O.bytes_rate : 0), null, `bytes from the server to the client per second, averaged ${over}.`);
    } else if (r) {
      const lim = limitsOf(r);
      const group = `${kindLabel(r.kind)} ${DIR_NAME[r.dir]}`;
      stat('count', count(r.n), null, `how many ${noun[1]} finished ${over}.`);
      stat('rate', `${rate(r.rate)}/s`, null, `${noun[1]} per second, averaged ${over}.`);
      stat('total time', spent(r.sum_ms), null, `every ${noun[0]}\u2019s duration added up ${over}. Each one is ${timed}.`);
      stat('share', share(r.share), null, `this line\u2019s part of the total time of all ${group} lines on the shown box ${over}. Big share = where the time goes.`);
      for (const k of ['mean', 'p50', 'p95', 'p99', 'max']) {
        const g = grade(r[k], lim);
        const n = k === 'mean' ? 'avg' : k;
        stat(n, ms(r[k]), g ? `g-${g}` : null, `${pctl(n, `${noun[0]} time`)} Green, yellow or red against this kind\u2019s latency limits.`);
      }
      stat('errors', count(r.err), r.err ? 'no' : null, r.kind === 'http' || r.kind === 'ws'
        ? `${noun[1]} answered with a 5xx status (the server failed) ${over}. 4xx answers are not counted here.`
        : `calls that failed ${over}: an error came back, or the call could not be made at all.`);
      if (r.kind === 'http') {
        stat('4xx', count(r.e4), r.e4 ? 'note' : null, `requests answered with a 4xx status ${over}: the client asked for something wrong, like bad input, not found or not allowed. Not counted as errors.`);
        stat('5xx', count(r.e5), r.e5 ? 'no' : null, `requests answered with a 5xx status ${over}: the server failed. These are the errors.`);
      }
    }

    const body = el('div', 'dr-body');
    body.dataset.scroll = `${v.name}-drawer`;
    const D = v.detail;
    if (!r) body.append(el('div', 'empty', tm.data ? 'this line has no calls over the range' : 'loading'));
    else if (!D || D.id !== v.open) body.append(el('div', 'empty', 'loading'));
    else if (D.error) body.append(el('div', 'note', D.error));
    else {
      const DI = S ? (r.dir === 'out' ? D.pair : D) : D;
      const DO = S ? (r.dir === 'out' ? D : D.pair) : null;
      const base = DI || D;
      const src = { t: base.t, bucket_secs: base.bucket_secs };
      const secs = base.bucket_secs || 60;
      const ps = (a) => (a || []).map((x) => (has(x) ? x / secs : null));
      const each = (lines, read) => (i) => lines.map((l) => [l.name, l.color, read((l.v || [])[i])]);
      const tile = (o, wide) => {
        const t = chart({ now, src, store: tcharts, ...o, tip: o.tip || each(o.lines, o.read) });
        if (wide) t.classList.add('wide');
        body.append(t);
      };
      if (DI) {
        const fmt = S ? spent : ms;
        const lat = [
          { name: 'avg', v: DI.avg, color: COLORS.white },
          { name: 'p50', v: DI.p50, color: COLORS.green },
          { name: 'p95', v: DI.p95, color: COLORS.blue },
          { name: 'p99', v: DI.p99, color: COLORS.violet },
          { name: 'max', v: DI.max, color: COLORS.red },
        ];
        const ref = S ? I : r;
        tile({ label: `${S ? 'session length' : 'latency'} per ${per(secs)}, ms, log scale`, read: fmt, value: ref ? `p99 ${fmt(ref.p99)} · max ${fmt(ref.max)}` : '', log: true, lines: lat,
          tip: (i) => [...lat.map((l) => [l.name, l.color, fmt(l.v[i])]), [S ? 'ended' : 'count', null, has(DI.n[i]) ? count(DI.n[i]) : '—']] }, true);
      }
      if (S) {
        if (DI) {
          tile({ label: 'open connections', read: count, value: `${count(I.open)} now`, lines: [{ name: 'open', v: DI.open, color: COLORS.blue }] });
          tile({ label: `ended and dropped per ${per(secs)}`, read: count, value: `${count(I.n)} · ${count(I.err)}`, lines: [{ name: 'ended', v: DI.n, color: COLORS.blue }, { name: 'dropped', v: DI.err, color: COLORS.red }] });
        }
        tile({ label: 'messages per second', read: rate, value: `in ${rate(I ? I.msgs_rate : 0)} · out ${rate(O ? O.msgs_rate : 0)}`,
          lines: [{ name: 'in', v: ps(DI && DI.msgs), color: COLORS.green }, { name: 'out', v: ps(DO && DO.msgs), color: COLORS.violet }] });
        tile({ label: 'bytes per second', read: Bps, value: `in ${Bps(I ? I.bytes_rate : 0)} · out ${Bps(O ? O.bytes_rate : 0)}`,
          lines: [{ name: 'in', v: ps(DI && DI.bytes), color: COLORS.green }, { name: 'out', v: ps(DO && DO.bytes), color: COLORS.violet }] });
      } else {
        tile({ label: 'requests per second', read: rate, value: `${rate(r.rate)}/s`, lines: [{ name: 'per second', v: ps(D.n), color: COLORS.blue }],
          tip: (i) => [['per second', COLORS.blue, rate(ps(D.n)[i])], ['count', null, has(D.n[i]) ? count(D.n[i]) : '—']] });
        tile({ label: `errors per ${per(secs)}`, read: count, value: `${count(r.err)}${r.kind === 'http' ? ` · 4xx ${count(r.e4)}` : ''}`,
          lines: r.kind === 'http'
            ? [{ name: '4xx', v: D.e4, color: COLORS.yellow }, { name: '5xx', v: D.e5, color: COLORS.red }, { name: 'all errors', v: D.err, color: COLORS.violet }]
            : [{ name: 'errors', v: D.err, color: COLORS.red }] });
        tile({ label: `time spent per ${per(secs)}`, read: spent, value: spent(r.sum_ms), lines: [{ name: 'time', v: D.sum, color: COLORS.violet }] }, true);
      }
      body.append(faultTile(D.faults, S ? `${count(I ? I.err : 0)} dropped ${over}` : `${count(r.err)} ${r.err === 1 ? 'error' : 'errors'}${r.kind === 'http' ? ` · ${count(r.e4)} 4xx` : ''} ${over}`));
    }
    const held = holdHint(dr);
    dr.replaceChildren(v.ui.grip, head, stats, body);
    body.scrollTop = scroll;
    const list = body.querySelector('.flist');
    if (list) list.scrollTop = listScroll;
    dr.classList.add('on');
    keepHint(stats, held);
  }

  const SITE_COUNTS = [
    { k: 'browsers', word: 'online', tip: (s) => `browsers with the site open now, signed in or not. each holds one events socket, shared by all its tabs${has(s.named) ? `. ${count(s.named)} of them carry a name, an account or a guest nick` : ''}` },
    { k: 'live', word: 'live', tip: () => 'streams being published to video now' },
    { k: 'viewers', word: 'watching', tip: () => 'players connected to those streams, added up over every stream' },
    { k: 'voice', word: 'voice', tip: (s) => `people seated in voice${has(s.calls) ? `, in ${count(s.calls)} ${s.calls === 1 ? 'call' : 'calls'}` : ''}` },
  ];
  const SITE_KEYS = ['browsers', 'named', 'live', 'viewers', 'calls', 'voice'];

  function siteCounts(shown) {
    const every = (state.monitor && state.monitor.metrics_every_secs) || 15;
    const now = Date.parse(state.now) + (Date.now() - state.received);
    const ts = shown === ALL ? state.targets : state.targets.filter((t) => t.name === shown);
    const age = (t) => (t.metrics && t.metrics.at ? (now - Date.parse(t.metrics.at)) / 1000 : Infinity);
    const fresh = ts.filter((t) => age(t) <= 3 * every + 15);
    const from = fresh.filter((t) => t.metrics.site);
    const sum = {};
    for (const k of SITE_KEYS) {
      const vs = from.map((t) => t.metrics.site[k]).filter(has);
      sum[k] = vs.length ? vs.reduce((a, b) => a + b, 0) : null;
    }
    const down = ts.filter((t) => t.status === 'down');
    const oldest = from.length ? Math.max(...from.map(age)) : null;
    const where = shown === ALL ? `added up over ${from.length} of ${ts.length} boxes` : `from ${shown}'s agent`;
    const when = shown === ALL ? `the oldest sampled ${human(Math.max(0, Math.round(oldest || 0)))} ago` : `sampled ${human(Math.max(0, Math.round(oldest || 0)))} ago`;
    const deploy = 'its agent sends no site counts yet: ./scripts/deploy.sh stats on that box';
    let g, k, tip;
    if (down.length === ts.length) {
      [g, k, tip] = ['down', `${shown === ALL ? 'every box' : shown} down`, `the monitor cannot reach ${down.map((t) => t.name).join(', ')}, so there are no counts`];
    } else if (!fresh.length) {
      [g, k, tip] = ['none', 'no fresh counts', `no metrics from ${shown === ALL ? 'any box' : shown} in the last ${human(3 * every + 15)}`];
    } else if (!from.length) {
      [g, k, tip] = ['none', 'no counts', shown === ALL ? `no box sends site counts yet: ./scripts/deploy.sh stats on each` : deploy];
    } else {
      const missing = ts.filter((t) => !from.includes(t)).map((t) => t.name);
      g = missing.length || down.length ? 'warn' : 'up';
      k = g === 'up' ? 'live counts' : `counts from ${from.length} of ${ts.length} boxes`;
      tip = `${where}, ${when}; ${shown === ALL ? 'each agent counts' : 'counted'} every ${every}s. numbers only, no names.${missing.length ? ` missing: ${missing.join(', ')}.` : ''}`;
    }
    return { g, k, tip, sum, where, any: from.length > 0, old: g !== 'up' };
  }

  function renderSite(shown) {
    const c = siteCounts(shown);
    const sig = JSON.stringify(c);
    if ($site.dataset.sig === sig) return;
    $site.dataset.sig = sig;
    const held = holdHint($site);
    const dot = tipped('', c.tip);
    dot.dataset.k = c.k;
    dot.classList.add('sd', c.g);
    dot.setAttribute('aria-label', c.k);
    const parts = [dot];
    const shownCounts = c.any ? SITE_COUNTS.filter((r) => has(c.sum[r.k])) : [];
    shownCounts.forEach((r, i) => {
      if (i) parts.push(el('span', null, '·'));
      const v = c.sum[r.k];
      const b = tipped('', `${r.tip(c.sum)}. ${c.where}.`);
      b.dataset.k = `${count(v)} ${r.word}`;
      b.replaceChildren(el('b', null, count(v)), document.createTextNode(` ${r.word}`));
      parts.push(b);
    });
    if (!shownCounts.length) parts.push(el('span', null, c.k));
    $site.classList.toggle('old', c.old);
    $site.replaceChildren(...parts);
    keepHint($site, held);
  }

  function renderPicker(shown) {
    const targets = state.targets;
    if (targets.length <= 1) {
      const t = targets[0];
      const sig = t ? `one|${t.name}|${t.status}` : 'none';
      if ($box.dataset.sig === sig) return;
      $box.dataset.sig = sig;
      $box.replaceChildren();
      if (t) {
        const s = el('span', null, t.name);
        s.title = `the only box watched, ${t.status}`;
        $box.append(s);
      }
      return;
    }
    const items = [...(allAllowed() ? [{ id: ALL, label: 'all boxes', note: `${targets.filter((t) => t.status === 'up').length}/${targets.length} up` }] : []), ...targets.map((t) => ({ id: t.name, label: t.name, status: t.status }))];
    const sig = `${items.map((i) => `${i.id}:${i.status || i.note}`).join('|')}|${shown}`;
    if ($box.dataset.sig === sig && $box.firstChild) return;
    $box.dataset.sig = sig;
    const cur = items.find((i) => i.id === shown) || items[0];
    const open = button(null, null, null);
    open.setAttribute('aria-haspopup', 'listbox');
    open.setAttribute('aria-expanded', 'false');
    open.setAttribute('aria-label', `box: ${cur.label}`);
    open.title = 'which box to show';
    open.append(document.createTextNode(cur.label), el('span', 'dim', '▾'));
    const ul = el('ul');
    ul.setAttribute('role', 'listbox');
    ul.tabIndex = -1;
    ul.hidden = true;
    let active = items.indexOf(cur);
    const lis = items.map((i, k) => {
      const li = el('li');
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', String(i.id === shown));
      li.dataset.box = i.id;
      li.append(...(i.status ? [el('span', `dot ${i.status}`)] : []), el('span', null, i.label));
      if (i.note) li.append(el('small', null, i.note));
      li.addEventListener('mousedown', (e) => e.preventDefault());
      li.addEventListener('click', () => { close(); choose({ box: i.id }); });
      li.addEventListener('mouseenter', () => { active = k; mark(); });
      return li;
    });
    ul.append(...lis);
    const mark = () => lis.forEach((li, k) => li.classList.toggle('active', k === active));
    const close = () => { ul.hidden = true; open.setAttribute('aria-expanded', 'false'); document.removeEventListener('mousedown', outside); };
    const outside = (e) => { if (!$box.contains(e.target)) close(); };
    const show = () => { ul.hidden = false; open.setAttribute('aria-expanded', 'true'); active = Math.max(0, items.findIndex((i) => i.id === shown)); mark(); document.addEventListener('mousedown', outside); };
    open.addEventListener('click', () => (ul.hidden ? show() : close()));
    open.addEventListener('keydown', (e) => {
      if (ul.hidden) {
        if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) { e.preventDefault(); show(); }
        return;
      }
      if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % items.length; mark(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = (active + items.length - 1) % items.length; mark(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const i = items[active]; close(); choose({ box: i.id }); }
      else if (e.key === 'Escape' || e.key === 'Tab') close();
    });
    open.addEventListener('blur', () => setTimeout(() => { if (!$box.contains(document.activeElement)) close(); }, 0));
    $box.replaceChildren(open, ul);
  }

  function renderNav(shown) {
    renderSite(shown);
    renderPicker(shown);
    $ranges.hidden = sel.tab === 'containers' && sel.cview === 'arch';
    if ($ranges.dataset.sig !== sel.range) {
      $ranges.dataset.sig = sel.range;
      $ranges.replaceChildren(...Object.keys(RANGES).map((r) => {
        const b = button(null, r, () => choose({ range: r }));
        b.setAttribute('aria-pressed', String(sel.range === r));
        return b;
      }));
    }
    const target = shown === ALL ? null : shown;
    const tot = totalsFor(target);
    const badge = (pred) => {
      const rows = tot.filter((r) => pred(r.kind) && r.kind !== 'session');
      return rows.length ? count(rows.reduce((s, r) => s + r.n, 0)) : '';
    };
    const sig = TABS.map((t) => t.id).join('|');
    if ($views.dataset.sig !== sig) {
      $views.dataset.sig = sig;
      $views.replaceChildren(...TABS.map((t) => {
        const b = button(null, null, () => choose({ tab: t.id }));
        b.id = `view-${t.id}`;
        b.dataset.id = t.id;
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-controls', 'main');
        b.addEventListener('keydown', (e) => {
          const i = TABS.findIndex((x) => x.id === t.id);
          const j = e.key === 'ArrowRight' ? (i + 1) % TABS.length : e.key === 'ArrowLeft' ? (i + TABS.length - 1) % TABS.length : -1;
          if (j < 0) return;
          e.preventDefault();
          choose({ tab: TABS[j].id });
          document.getElementById(`view-${TABS[j].id}`).focus();
        });
        return b;
      }));
    }
    for (const b of $views.children) {
      const id = b.dataset.id;
      const on = id === sel.tab;
      b.setAttribute('aria-selected', String(on));
      b.tabIndex = on ? 0 : -1;
      const extra = id === 'endpoints' ? badge((k) => ENDPOINT_KINDS.includes(k)) : id === 'calls' ? badge((k) => !ENDPOINT_KINDS.includes(k)) : '';
      b.replaceChildren(document.createTextNode(TABS.find((x) => x.id === id).label));
      if (extra) b.append(el('small', null, extra));
    }
    $main.setAttribute('aria-labelledby', `view-${sel.tab}`);
  }

  function renderStatus() {
    const errs = [...problems.values()];
    if (stateError) errs.unshift(stateError);
    if (views[sel.tab] && tm.error) errs.push(`timings: ${tm.error}`);
    const ok = !errs.length && !!state;
    $status.className = `dot ${ok ? 'ok' : state || stateError ? 'bad' : ''}`;
    $status.dataset.ok = String(ok);
    const m = (state && state.monitor) || {};
    const about = state ? `build ${m.build} · up ${human(m.up_secs || 0)} · every ${m.check_every_secs}s · down after ${m.down_after} misses · ${m.webhook ? 'webhook on' : 'no webhook'}${m.public ? ' · public' : ''}` : 'loading';
    $status.title = ok ? `refreshed · ${about}` : `${errs.join('\n') || 'loading'}\n${about}`;
    $status.setAttribute('aria-label', ok ? 'refreshed' : `refresh problem: ${errs.join('; ')}`);
  }

  function mount(nodes) {
    const keep = new Map();
    for (const e of $main.querySelectorAll('[data-scroll]')) keep.set(e.dataset.scroll, [e.scrollTop, e.scrollLeft]);
    const same = nodes.length === $main.childNodes.length && nodes.every((n, i) => $main.childNodes[i] === n);
    if (!same) $main.replaceChildren(...nodes);
    for (const e of $main.querySelectorAll('[data-scroll]')) {
      const k = keep.get(e.dataset.scroll);
      if (k) { e.scrollTop = k[0]; e.scrollLeft = k[1]; }
    }
  }

  function render() {
    for (const k of [...problems.keys()]) if (k.startsWith('draw ')) problems.delete(k);
    try {
      renderPage();
    } catch (e) {
      console.error('render', e);
      problems.set('draw page', `could not draw the page: ${e && e.message ? e.message : e}`);
    }
    renderStatus();
  }

  function renderPage() {
    if (!state) return;
    charts.length = 0;
    const now = Date.parse(state.now) + (Date.now() - state.received);
    if (!state.targets.length) {
      $box.replaceChildren();
      $box.dataset.sig = '';
      $site.replaceChildren();
      $site.dataset.sig = '';
      $ranges.hidden = true;
      $views.hidden = true;
      $q.hidden = true;
      mount([el('p', 'empty', 'nothing to watch. STATS_TARGETS in .env (or TARGETS in monitor/.env), then deploy')]);
      return;
    }
    $views.hidden = false;
    syncSearch();
    const shown = boxShown();
    renderNav(shown);
    const v = views[sel.tab];
    if (v) {
      if (!v.ui) timingBuild(v);
      mount([v.ui.sec]);
      if (v.ui.sig === timingSig(v)) return;
      const failed = guard(v.name, () => { timingRender(v); return null; });
      if (failed) mount([v.ui.sec, failed]);
      return;
    }
    if (sel.tab === 'containers') {
      mount(containersTab(shown, now));
    } else if (shown === ALL) {
      const pane = el('div', 'pane grow overview');
      pane.dataset.scroll = 'overview';
      pane.append(...state.targets.map((t) => guard(t.name, () => statusCard(t, now, true))));
      mount([pane]);
    } else {
      const t = state.targets.find((x) => x.name === shown);
      mount([guard(`host · ${t.name}`, () => hostTab(t, now))]);
    }
    requestAnimationFrame(() => {
      for (const c of charts) {
        if (!c.dirty) continue;
        try { draw(c); c.dirty = false; } catch (e) { console.error('chart', e); }
      }
    });
  }

  async function getJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) {
      let why = '';
      try { why = (await res.json()).error || ''; } catch (e) { why = ''; }
      throw new Error(`GET ${url.split('?')[0]} answered ${res.status}${why ? `: ${why}` : ''}`);
    }
    const d = await res.json();
    d.received = Date.now();
    return d;
  }

  async function loadSeries(box, force) {
    const key = `${box}|${sel.range}`;
    const c = seriesCache.get(box) || {};
    if (!force && c.key === key && Date.now() - c.at < RANGES[sel.range].every) return false;
    seriesCache.set(box, { ...c, key, at: Date.now() });
    try {
      const s = await getJson(`/api/monitor/metrics?target=${encodeURIComponent(box)}&range=${sel.range}`);
      const cur = seriesCache.get(box);
      if (cur.key === key) { cur.data = normSeries(s); cur.error = null; }
      problems.delete(`series ${box}`);
    } catch (e) {
      const cur = seriesCache.get(box);
      cur.at = 0;
      cur.error = `could not load the graphs: ${e.message}`;
      problems.set(`series ${box}`, `${box}: ${cur.error}`);
    }
    return true;
  }

  async function loadSpark(box, force) {
    const c = sparkCache.get(box) || {};
    if (!force && Date.now() - (c.at || 0) < SPARK_EVERY) return false;
    sparkCache.set(box, { ...c, at: Date.now() });
    try {
      const s = await getJson(`/api/monitor/metrics?target=${encodeURIComponent(box)}&range=1h`);
      sparkCache.get(box).data = normSeries(s);
    } catch (e) {
      sparkCache.get(box).at = 0;
    }
    return true;
  }

  async function loadArch(box, force) {
    const c = archCache.get(box) || {};
    if (!force && Date.now() - (c.at || 0) < ARCH_EVERY) return false;
    archCache.set(box, { ...c, at: Date.now() });
    try {
      const d = await getJson(`/api/monitor/architecture?target=${encodeURIComponent(box)}`);
      Object.assign(archCache.get(box), { data: normArch(d), error: null });
      problems.delete(`arch ${box}`);
    } catch (e) {
      Object.assign(archCache.get(box), { at: 0, error: `could not load the architecture: ${e.message}` });
      problems.set(`arch ${box}`, `${box}: could not load the architecture: ${e.message}`);
    }
    return true;
  }

  async function loadTimings(force) {
    if (!force && tm.key === sel.range && Date.now() - tm.at < RANGES[sel.range].every) return false;
    tm.key = sel.range;
    tm.at = Date.now();
    try {
      const d = await getJson(`/api/monitor/timings?range=${sel.range}`);
      if (d.range !== sel.range) return false;
      tm.data = normTimings(d);
      tm.error = null;
    } catch (e) {
      tm.at = 0;
      tm.error = e.message;
    }
    return true;
  }

  async function loadDetail(v) {
    const id = v.open;
    if (!id) return;
    const [target, key] = id.split('\u0000');
    const get = (k) => getJson(`/api/monitor/timings/series?target=${encodeURIComponent(target)}&key=${encodeURIComponent(k)}&range=${sel.range}`);
    const row = findRow(id);
    const pair = pairOf(row);
    const fk = row && row.kind === 'session' && row.dir === 'out' ? (pair ? pair.key : null) : key;
    const faults = fk
      ? getJson(`/api/monitor/timings/errors?target=${encodeURIComponent(target)}&key=${encodeURIComponent(fk)}`)
        .then((f) => ({ rows: (Array.isArray(f.rows) ? f.rows : []).filter((x) => x && typeof x === 'object'), kept: f.kept || 100 }), (e) => ({ error: e.message }))
      : Promise.resolve({ rows: [], kept: 100 });
    try {
      const [d, p, f] = await Promise.all([get(key), pair ? get(pair.key).catch(() => null) : null, faults]);
      if (v.open === id) v.detail = { ...normDetail(d), id, pair: p ? normDetail(p) : null, faults: f };
    } catch (e) {
      if (v.open === id) v.detail = { id, error: `could not load the graphs: ${e.message}` };
    }
  }

  async function loadVisible(force) {
    if (!state || !state.targets.length) return;
    const shown = boxShown();
    const jobs = [];
    if (sel.tab === 'host' && shown !== ALL) jobs.push(loadSeries(shown, force));
    if (sel.tab === 'containers') {
      if (sel.cview === 'arch') jobs.push(loadArch(shown, force), loadSpark(shown, false));
      else for (const b of boxesShown()) jobs.push(loadSeries(b, force));
    }
    const v = views[sel.tab];
    if (v) jobs.push(loadTimings(force).then(async (changed) => { if (changed && v.open) await loadDetail(v); return changed; }));
    if (!jobs.length) return;
    const changed = await Promise.all(jobs);
    if (changed.some(Boolean)) render();
  }

  async function loadState() {
    let next;
    try {
      next = normState(await getJson('/api/monitor'));
    } catch (e) {
      stateError = state ? `could not refresh (${e.message}). as of ${clock(new Date(state.received).toISOString())}` : `could not load: ${e.message}`;
      renderStatus();
      return;
    }
    const build = next.monitor.build;
    if (build && pageBuild && build !== pageBuild) {
      location.reload();
      return;
    }
    pageBuild = pageBuild || build;
    state = next;
    stateError = null;
    render();
  }

  async function tick() {
    await loadState();
    await loadVisible(false);
  }

  readHash();
  renderStatus();
  window.addEventListener('hashchange', () => { readHash(); render(); loadVisible(true); });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    applyDrawerWidth();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { for (const c of charts) draw(c); for (const c of tcharts) draw(c); }, 100);
  });
  tick();
  setInterval(() => { if (!document.hidden) tick(); }, 5000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
