[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
hmac = "0.12"
log = "0.4"
rand = "0.8"
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "streams"] }
# rustls-tls (ring, roots built in): `api monitor` talks https to other boxes, and the api
# talks https when S3_ENDPOINT is a real bucket. the container bucket is plain http.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
unicode-normalization = "0.1"
# the id behind a name (docs/ids.md). postgres makes them (gen_random_uuid); the api only carries them
uuid = { version = "1", features = ["serde"] }
